name: CI · Windows · MSVC

# 一平台一个文件 —— 这个文件里**只有** Windows (MSVC) 这条腿的测试。四个文件：
# ci-linux-ubuntu.yml / ci-windows-msvc.yml / ci-mingw64.yml / ci-macos.yml。
# MinGW 是**另一个**文件（那是一条不同的工具链、不同的发布产物，见 ci-mingw64.yml）。
#
# 文件内按**功能分格**：矩阵里一格一个 feature，格的名字就是 check 名
# （`CI · Windows · MSVC / quic`）。骨架只写一次，格与格的差别全在矩阵条目里。
#
# 不设 `concurrency:`：取消一次正在跑的 run 等于**丢一组门禁**。
#
# 布局规范（含**未覆盖的格**和为什么）在 doc/ci-guide.md §1。

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  windows:
    name: CI · Windows · MSVC / ${{ matrix.feature }}
    runs-on: windows-latest
    # 90 而不是 60：矩阵没法按条目设 timeout，而这一格里 quic 那格会装 OpenSSL
    # 再配一遍；一条挂死的 Windows 腿因此会烧 90 分钟。接受，写在这里。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # 基础版（shared）：内存池自 v1.1.0 起默认 OFF，这里显式打开，保住
          # MSVC/Windows 侧的 test_memory_pool 覆盖 —— 内存池出问题的平台恰恰是
          # Windows。**别顺手把这行删掉。**
          - feature: basic-shared
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_STATIC=OFF
              - -DUVCPP_BUILD_SHARED=ON
              - -DUVCPP_BUILD_WEB=OFF
              - -DUVCPP_BUILD_EXPAND=ON
          # 基础版（static）：MSVC 静态档。web=OFF，且**不用** `-DUVCPP_BUILD_WEB=ON`。
          - feature: basic-static
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_STATIC=ON
              - -DUVCPP_BUILD_SHARED=OFF
              - -DUVCPP_BUILD_WEB=OFF

          # web：`UVCPP_ENABLE_ZLIB` 必须留 ON —— webapp 的压缩用例断言 gzip 真的
          # 发生过，zlib 关着那两个组会红。zlib 走 FetchContent，不需要系统依赖。
          - feature: web
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_SHARED=ON
              - -DUVCPP_BUILD_WEB=ON
              - -DUVCPP_BUILD_WEBAPP=ON
              - -DUVCPP_ENABLE_ZLIB=ON

          # wsdl：与 `web` 的 `flags` **逐字相同**，只多一个 `-DUVCPP_ENABLE_WSDL=ON`。
          #
          # `UVCPP_ENABLE_WSDL` 默认 OFF，别的格都不编译 `src/wsdl/`（同理，MSVC
          # 从没编过它）。只在 `release.yml` 打开的话，这条配置第一次被编到就是
          # **发版那一刻** —— 而 release.yml 的 msvc-x64 / msvc-arm64 两条腿都开着
          # 它。这一格就是那两条腿在 push/PR 阶段的替身。
          #
          # pugixml 走 FetchContent（根 `CMakeLists.txt:1401`，`GIT_TAG` 钉在
          # `PUGIXML_VERSION`），**不需要新包**；它与 zlib 同一个形状，所以这一格
          # 的装包需求与 `web` 逐字相同。
          # 四个门禁串见 doc/ci-guide.md §5。
          - feature: wsdl
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_SHARED=ON
              - -DUVCPP_BUILD_WEB=ON
              - -DUVCPP_BUILD_WEBAPP=ON
              - -DUVCPP_ENABLE_ZLIB=ON
              - -DUVCPP_ENABLE_WSDL=ON
            gate_name: pugixml
            gate_switch: 'UVCPP_ENABLE_WSDL:BOOL=ON'
            gate_integrated: pugixml integrated
            gate_module: Including wsdl module in build
            gate_test: test_wsdl_document_func

          - feature: ssl
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_SHARED=ON
              - -DUVCPP_BUILD_WEB=ON
              - -DUVCPP_BUILD_WEBAPP=ON
              - -DUVCPP_ENABLE_OPENSSL=ON
              - -DUVCPP_ENABLE_ZLIB=ON

          # h2：门禁的四个串见 doc/ci-guide.md §5。这一格是 Windows 上唯一编译
          # `src/http2/` 的配置。
          # ★ 批 3a（1.4.3）给这一格加了一行 `-DUVCPP_ENABLE_CAPI=ON`：h2 是
          #   **唯一**带 NGHTTP2 的一格，而 `src/capi/uvcpp_c_http2.cpp` 跟着那个
          #   开关走（顶层那张 `UVCPP_CAPI_DISABLED` 表）—— 不加这一行，
          #   `tests/capi/capi_h2_func.c` 这个目标在 MSVC 下不存在，"h2 的 C 面
          #   在 MSVC 上编得过、跑得起来"就是零。WEB / WEBAPP 本来就是 ON，
          #   所以配出来的模块集合与本机那棵 `build-capi-h2` 逐字相同。
          #
          #   顺带：`tests/capi/` 早就进了 `_test_dll_dirs`（根 CMakeLists.txt）
          #   与下面那份 `test_dirs` 拷贝清单，所以这一格多出来的三个 C 用例
          #   不需要再动 DLL 那一段。
          - feature: h2
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_SHARED=ON
              - -DUVCPP_BUILD_WEB=ON
              - -DUVCPP_BUILD_WEBAPP=ON
              - -DUVCPP_ENABLE_OPENSSL=ON
              - -DUVCPP_ENABLE_ZLIB=ON
              - -DUVCPP_ENABLE_NGHTTP2=ON
              - -DUVCPP_ENABLE_CAPI=ON
            gate_name: nghttp2
            gate_switch: 'UVCPP_ENABLE_NGHTTP2:BOOL=ON'
            gate_integrated: nghttp2 integrated
            gate_module: Including http2 module in build
            gate_test: test_h2_session_func

          # quic（1.4.1 新增的腿）：**MSVC 从没编过 `src/quic/*.cpp`** —— 以前只有
          # ubuntu 一条腿编它，MinGW / MSVC / Apple clang 一个字节都没编过。这条腿
          # 存在的理由就是这个：真红了是它想抓的 rot，不是新设计错了。
          #
          # 这里的 OpenSSL 来自 `choco install openssl`（同 ssl/h2 那两格）。它若是
          # < 3.2（没有 QUIC API），**不会**在配置期 FATAL：根 `CMakeLists.txt` 的
          # QUIC 预检会先 WARNING + 普通 `set(UVCPP_ENABLE_QUIC OFF)`，而 cache 照样
          # 写着 ON —— 于是咬人的是门禁 ②（`ngtcp2 integrated` 缺席），注解里会说清。
          # 退路写在 doc/ci-guide.md §5：照 ubuntu 那条腿在 job 内自建 OpenSSL，
          # 但 Windows 上 `nmake` 不并行，所以先试包管理器这条路。
          #
          # **不要**给这一格加 `-DOPENSSL_USE_STATIC_LIBS=ON`：choco 那份 OpenSSL
          # 没有静态库，钉了会让 find_package 落空、`UVCPP_ENABLE_OPENSSL` 被静默降级
          # 成 OFF，红在对的地方之外（这条踩过，见 config-contract 那段的注释）。
          # 动态链 OpenSSL ⇒ 下面 Copy runtime DLLs 必须把 libssl-3-x64.dll /
          # libcrypto-3-x64.dll 放到 exe 旁边，否则所有用例以 `0xC0000135` 退出，
          # 看起来像 DLL 拷贝的 bug 而不像 QUIC 的问题。
          - feature: quic
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_SHARED=ON
              - -DUVCPP_BUILD_NET=ON
              - -DUVCPP_BUILD_WEB=OFF
              - -DUVCPP_ENABLE_OPENSSL=ON
              - -DUVCPP_ENABLE_QUIC=ON
            gate_name: ngtcp2
            gate_switch: 'UVCPP_ENABLE_QUIC:BOOL=ON'
            gate_integrated: ngtcp2 integrated
            gate_module: Including quic module in build
            gate_test: test_quic_api_func

          # http3（1.4.1 新增的腿）：web 层多出来的那条 h3 传输。与 quic 那一格
          # 的差别就是 **WEB=ON** —— h3 的公开面长在 `uvcpp_http_client` /
          # `uvcpp_http_server` 上，web 关着时 `CMakeLists.txt` 会把它强制关掉。
          #
          # **这一格是本机验不了的**（开发机上没有 MSVC），第一次绿是在 CI 上 ——
          # 与 `quic` 那一格当年同一条路径。会红的地方与它同源：nghttp3 作为子
          # 项目在 MSVC 上编、以及"拷源码 + 摘掉那行 add_custom_target(check)"
          # 那段 CMake 在 MSVC 上的行为。`src/http3/*.cpp` 由我们编，而本工程
          # **没有** `/W4 /WX`（根 CMakeLists 里一个 warning 开关都没有），所以
          # 那里没有 Windows 独有的硬失败面。
          #
          # OpenSSL 与 quic 那一格同一份（`choco install openssl`），所以
          # "不要加 `-DOPENSSL_USE_STATIC_LIBS=ON`"那条警告同样适用；nghttp3 被
          # 压成静态，所以下面 Copy runtime DLLs 那里**不需要**为它加一行
          # （`libssl-3-x64.dll` 那两行照旧要）。
          #
          # 1.4.4 起它也带 `-DUVCPP_ENABLE_CAPI=ON`：批 3b 的 C 面（quic + http3）
          # —— 这一格的"C 面在 `_WIN32` 下"那条价值在这里比在 `capi` 格更大：
          # `tests/capi/capi_quic_h3_func.c` 是这一批唯一一份**真的用 UDP 发字节**
          # 的纯 C 用例，而它链的是 DLL（`UVCPP_C_SHARED` 那侧的 `dllimport`）。
          # `src/capi/uvcpp_c_quic.cpp` / `uvcpp_c_http3.cpp` 也第一次被 `cl` 编。
          - feature: http3
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_SHARED=ON
              - -DUVCPP_BUILD_NET=ON
              - -DUVCPP_BUILD_WEB=ON
              - -DUVCPP_ENABLE_OPENSSL=ON
              - -DUVCPP_ENABLE_ZLIB=ON
              - -DUVCPP_ENABLE_QUIC=ON
              - -DUVCPP_ENABLE_HTTP3=ON
              - -DUVCPP_ENABLE_CAPI=ON
            gate_name: nghttp3
            gate_switch: 'UVCPP_ENABLE_HTTP3:BOOL=ON'
            gate_integrated: nghttp3 integrated
            gate_module: Including http3 module in build
            gate_test: test_http3_web_func

          # capi（1.4.1 新增的腿）：**C ABI 那一层**。这一格在 MSVC 上不是"多一
          # 个模块"，而是这一层**唯一**能被 `cl` 编一遍的地方 —— 而且它是**两件**
          # 事情的判据，缺了哪件都得靠猜：
          #
          # ① `UVCPP_C_API` 那枚宏在 `_WIN32` 下走的是 `dllexport`/`dllimport`
          #    两条分支（`UVCPP_C_BUILD` / `UVCPP_C_SHARED`），而 `UVCPP_C_SHARED`
          #    是 SHARED 目标上的 PUBLIC 定义 —— 也就是说**这一格验证的正是
          #    "消费方加了 `dllimport` 还链得上"**。它错了在别的平台上一点感觉
          #    都没有（那两条分支只在 `_WIN32` 下非空）。
          # ② `tests/capi/` 那**四**个用例是**纯 C**（`C_STANDARD 99`），`cl` 编 `.c`
          #    走的是它自己的 C 前端：`extern "C"` 那套收口宏、`UVCPP_C_API` 的
          #    位置、头里有没有漏掉 C++ 才认的写法 —— 这些只有 `cl` 能判。
          #
          # ★ 1.5.3 起这一格**同时开 DB**（只开 SQLite，两个远程后端显式 OFF），
          # 于是第三件事也归它判：**C 面的 db 包装在 MSVC 上编得过、跑得起来**。
          # 与 Ubuntu 那一格不同，这里让 db 上这一格的**首要理由不是符号锁**
          # （`check_capi_symbols.py` 只认 ELF 的动态符号表方言，Windows 上退 3），而是
          # "这一层在 `cl` 下没被编过一次"这件事本身。
          #
          # SQLite 走**从源码编**（`-DUVCPP_DB_SQLITE_FROM_SOURCE=ON`）：Windows
          # 上没有系统 sqlite3，这与 `db` 那一格、与 `release.yml` 六条腿走的是
          # 同一条路。**不加这个开关**，`find_package(SQLite3)` 会失败 ⇒ 守卫把
          # `UVCPP_ENABLE_DB` 强制关掉 ⇒ C 面那 81 个符号一个都不编，而整格**全绿**
          # （cache 里 `UVCPP_ENABLE_CAPI:BOOL=ON` 照旧）—— 所以下面另有一条
          # `Gate — the C ABI leg really has the db slice open` 专门证伪它。
          #
          # 依赖：与 `web` 那一格同一份 —— **没有系统依赖**（libuv 与 llhttp 走
          # FetchContent，SQLite 走 FetchContent）。所以下面那个 `case` 仍然把它
          # 归到"没有系统依赖"那一行里，别顺手塞进 win-openssl-deps.sh。
          # （与 Ubuntu 那格的差别：那边 SQLite 是 `apt` 的 `libsqlite3-dev`，
          # 这边是从源码编 —— 两边都不需要额外装包，但路子不同。）
          - feature: capi
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_SHARED=ON
              - -DUVCPP_BUILD_NET=ON
              - -DUVCPP_BUILD_WEB=ON
              - -DUVCPP_BUILD_WEBAPP=ON
              - -DUVCPP_ENABLE_ZLIB=ON
              - -DUVCPP_ENABLE_CAPI=ON
              - -DUVCPP_ENABLE_DB=ON
              - -DUVCPP_ENABLE_DB_SQLITE=ON
              - -DUVCPP_DB_SQLITE_FROM_SOURCE=ON
              - -DUVCPP_ENABLE_DB_MYSQL=OFF
              - -DUVCPP_ENABLE_DB_PGSQL=OFF
            gate_name: capi
            gate_switch: 'UVCPP_ENABLE_CAPI:BOOL=ON'
            gate_integrated: C ABI enabled
            gate_module: Including capi module in build
            gate_test: test_capi_net_func

          # db（1.5.x 新增的腿）：数据库模块（`src/db/`）。`UVCPP_ENABLE_DB`
          # **默认 OFF**，所以别的格一行 `src/db/` 都不编 —— 少了这一格，整个
          # 数据库模块可以带着 CI 全绿推上去而从未被 `cl` 编过一次。
          #
          # 这一格的 SQLite **从源码编**（`-DUVCPP_DB_SQLITE_FROM_SOURCE=ON`）：
          # Windows 上没有系统 sqlite3，而这正是**发布包走的那条路** ——
          # `release.yml` 六条腿全用这个开关。于是这一格量的不只是"数据库模块在
          # MSVC 上编得过"，还有那条 `file(DOWNLOAD)` 在 Windows 上走得通：CMake
          # 官方二进制自带的 libcurl 走 **Schannel**（`Utilities/cmcurl/CMakeLists.txt`
          # 里 `elseif(WIN32) set(CURL_USE_SCHANNEL ON)`），用的是 Windows 证书存储，
          # 所以 `TLS_VERIFY ON` 不依赖任何 CA 文件。配置期需要联网；离线机器可以
          # 把那份 zip 按哈希放进 `${构建目录}/_deps/uvcpp-sqlite/`（见 doc/db-guide.md）。
          #
          # MySQL / PostgreSQL 两个远程后端**显式 OFF**：这一档没有服务端，开了
          # 只会得到两条退 3（未判定）的用例 —— "未判定"在 job 结论里是**非红**，
          # 那不是覆盖。两个远程后端由 Ubuntu 的 `db-servers` job 用服务容器量。
          - feature: db
            flags:
              - -DUVCPP_BUILD_TESTS=ON
              - -DUVCPP_BUILD_SHARED=ON
              - -DUVCPP_ENABLE_DB=ON
              - -DUVCPP_DB_SQLITE_FROM_SOURCE=ON
              - -DUVCPP_ENABLE_DB_MYSQL=OFF
              - -DUVCPP_ENABLE_DB_PGSQL=OFF
            gate_name: sqlite3
            gate_switch: 'UVCPP_ENABLE_DB:BOOL=ON'
            gate_integrated: 'db: SQLite 后端开'
            gate_module: Including db module in build
            gate_test: test_db_sqlite_func
    steps:
      - uses: actions/checkout@v4

      # 装包**按格**：basic 那两格、web 与 capi 这几格一个系统依赖都不需要（libuv 与
      # llhttp 都走 FetchContent；llhttp 只在 WEB=ON 时才去取，所以 basic 那两格连它
      # 都没有）。capi 与 web 同一份 —— C 层是**纯增量**的薄包装，不加任何外部依赖。
      # db 也在这一组：它的 SQLite 从源码编（理由写在矩阵那一格里）。
      #
      # 有系统依赖的那四格统一交给 `.github/scripts/win-openssl-deps.sh`：它把判据从
      # "choco 退出 0"改成"这台机器上有一份 CMake 找得到的 OpenSSL"，理由（含
      # 2026-09-29 20:46 UTC 起 `choco install openssl` 恒非 0 退出那件事）写在那个
      # 脚本的头部。**别把这一行改回裸 choco**。
      - name: Install deps
        shell: bash
        run: |
          case "${{ matrix.feature }}" in
            # wsdl 也在这一组：pugixml 走 FetchContent，与 zlib 一样不是系统依赖。
            # db 也是：它的 SQLite 是**从源码编**的（`UVCPP_DB_SQLITE_FROM_SOURCE`），
            # 所以 Windows 上不需要任何 sqlite 包 —— 这一格一个系统依赖都没有，
            # 别把它塞进 win-openssl-deps.sh（那是 OpenSSL 专用的）。
            basic-static|basic-shared|web|capi|wsdl|db) echo "(这一格没有系统依赖)" ;;
            ssl|h2|quic|http3)             bash .github/scripts/win-openssl-deps.sh ;;
            *) echo "::error title=deps::装包表里没有这一格：${{ matrix.feature }}"; exit 1 ;;
          esac

      - name: Configure & Build
        shell: bash
        run: |
          set -o pipefail
          feat="${{ matrix.feature }}"
          tree="build-$feat"
          mkdir -p ci-logs
          {
            echo "=== toolchain ==="
            cmake --version
            openssl version 2>/dev/null || echo "(openssl not on PATH)"
            echo "=== configure ==="
            cfg=0
            cmake -S . -B "$tree" -DCMAKE_BUILD_TYPE=Release \
              ${{ join(matrix.flags, ' ') }} \
              > "ci-logs/$feat-configure.log" 2>&1 || cfg=$?
            echo "CONFIGURE_RC=$cfg"
            cat "ci-logs/$feat-configure.log"
            if [ "$cfg" != "0" ]; then exit "$cfg"; fi

            # 门禁 1：这一格开的模块**真的**被集成了。三条判据缺一不可（理由见
            # doc/ci-guide.md §5）：缓存里开关是 ON、配置消息里出现了
            # `<dep> integrated`、`src/<module>/` 真的进了源列表。
            if [ -n "${{ matrix.gate_switch }}" ]; then
              grep -q '${{ matrix.gate_switch }}' "$tree/CMakeCache.txt" || {
                echo "::error title=$feat::CMakeCache 里 ${{ matrix.gate_switch }} 不是 ON —— 这一格没在测 ${{ matrix.gate_name }}"; exit 1; }
              grep -q '${{ matrix.gate_integrated }}' "ci-logs/$feat-configure.log" || {
                # 把**配置期的原话**折进注解：这条门禁最常被 OpenSSL/依赖不对触发，
                # 而那种情形下 root CMakeLists 的预检只会 WARNING 一句、把开关
                # 静默关掉（cache 里照样写着 ON），真正的原因只在那句 WARNING 里。
                # 公仓的 artifact zip 匿名下载是 401（实测），所以注解是唯一
                # 不登录读得到的地方 —— 原话必须跟着走，否则下一次红又要靠猜。
                why=$(grep -E '(CMake (Warning|Error)|QUIC API|ngtcp2|nghttp2|Cannot|Unsupported|No such)' \
                  "ci-logs/$feat-configure.log" | head -10 | tr '\n' ' ' | sed 's/%/%25/g' || true)
                echo "::error title=$feat::配置消息里没有 '${{ matrix.gate_integrated }}' —— ${{ matrix.gate_name }} 没被集成${why:+；配置期的原话：$why}"; exit 1; }
              grep -q '${{ matrix.gate_module }}' "ci-logs/$feat-configure.log" || {
                echo "::error title=$feat::src/ 里那一块没进源列表 —— 编出来的库不含 ${{ matrix.gate_name }}"; exit 1; }
            fi

            echo "=== resolved toolchain (CMakeCache) ==="
            grep -E '^(CMAKE_(GENERATOR|LINKER|CXX_COMPILER|C_COMPILER|VS_|MSVC)|MSVC_|OPENSSL_|NGHTTP2_|NGTCP2_)' \
              "$tree/CMakeCache.txt" || true
            echo "=== build ==="
            bld=0
            cmake --build "$tree" --config Release --parallel 4 2>&1 \
              | tee "ci-logs/$feat-build.log" || bld=$?
            echo "BUILD_RC=$bld"
            if [ "$bld" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                "ci-logs/$feat-build.log" | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
                | head -c 6000 || true)
              echo "::error title=build-$feat::${msg:-rc=$bld (no error line matched)}"
            fi
            exit "$bld"
          } 2>&1 | tee "ci-logs/$feat.log"

      # 名字必须带 feat：upload-artifact 的名字在**一次 run 内唯一**，两条矩阵腿
      # 同名会让后一条红在 "an artifact with this name already exists" 上。
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows-msvc-${{ matrix.feature }}
          path: ci-logs/
          if-no-files-found: ignore

      # 一条**共用**的、容错的拷贝步（每一行 `2>/dev/null || true`），替掉原先
      # 每个 job 各写一遍的硬编码清单：非系统 DLL 只有 llhttp（web 起）与 OpenSSL
      # （ssl 起）。CMakeLists 的 POST_BUILD 会拷 `uvcpp.dll`，FetchContent 的依赖
      # 不会 —— 那就是这一步存在的理由。
      - name: Copy runtime DLLs (Windows)
        shell: bash
        run: |
          feat="${{ matrix.feature }}"
          tree="build-$feat"
          # ★ 测试目录**只有这一份清单**，下面两处循环都用它。
          #
          # 原先这行是硬编码的 `tests/unit tests/functional tests/expand`，而
          # 1.4.1 加的 `tests/capi/` 不在里面。Windows 没有 rpath：`uvcpp.dll`
          # 与 `uv.dll` 必须与 .exe 同目录才找得到，而 `tests/capi/` 那三条纯 C
          # 用例是这一层唯一**只**链这两个 DLL 的可执行文件 —— 于是它们在
          # 加载期就被拦下，一行自己的代码都没跑。
          #
          # 观察到的形状（`9ee0027` / `d3b5b68` / `b867d51` 三次注解逐条一样）：
          #
          #     91/93 Test #91: test_capi_common_func ...***Timeout 60.12 sec
          #     92/93 Test #92: test_capi_net_func    ...***Timeout 60.00 sec
          #     93/93 Test #93: test_capi_webapp_func ...***Timeout 60.01 sec
          #
          # 三条都**正好**撞在 ctest 自己那个 `TIMEOUT 60` 上，而且捕获到的输出
          # 一片空白 —— 与"用例断言为假"（那会立刻打 FAIL 并以非 0 退出）不是
          # 一回事。加载期失败的两种表现形式（直接 0xc0000135 退出，或者弹一个
          # 系统错误框、进程就停在那里直到被 ctest 杀掉）取决于父进程的 error
          # mode，本仓 `tests/expand` 那次实测到的是前者、注解只能说后者；两种
          # 都指向已经修掉的那一份漏拷。**这一格的判据只能由 CI 来量**（本机没有
          # MSVC），所以这条注释写的是"改了什么、为什么"，不是"已经绿了"。
          #
          # 所以这里**不是**"顺手补一个目录"，是把那份清单提到一个变量上：
          # 下一个模块加测试目录时只改这一行，两处循环不可能再各自漂。
          # 同一份漏拷在 `CMakeLists.txt` 的 `_test_dll_dirs` 里也有一份，一起改了。
          test_dirs="tests/unit tests/functional tests/expand tests/capi"
          for d in $test_dirs; do
            mkdir -p "$tree/$d/Release"
            cp "$tree/Release/uvcpp.dll" "$tree/$d/Release/" 2>/dev/null || true
            cp "$tree/_deps/libuv-build/Release/uv.dll" "$tree/$d/Release/" 2>/dev/null || true
            # llhttp — built as shared when BUILD_SHARED_LIBS=ON. 只在 WEB=ON 的那些
            # 格上存在：llhttp 的 FetchContent 挂在 `if(UVCPP_BUILD_WEB)` 里面
            # （CMakeLists.txt 里有注释），所以 basic-* 与 quic 那几格的 _deps/ 底下
            # 根本没有 llhttp，这两行是**覆盖一个没被编出来的文件**的容错空操作。
            # 别把"没拷到 llhttp.dll"当成 basic/quic 那一格的 bug。
            cp "$tree/_deps/llhttp-build/Release/llhttp.dll" "$tree/$d/Release/" 2>/dev/null || true
            cp "$tree/_deps/llhttp-build/llhttp.dll" "$tree/$d/Release/" 2>/dev/null || true
          done
          # **nghttp2 / ngtcp2 / nghttp3 这里刻意没有 cp**：三者都被压成静态
          # （`nghttp2_static` + `NGHTTP2_STATICLIB`、`ngtcp2_static` +
          # `ngtcp2_crypto_ossl_static`、`nghttp3_static`），`uvcpp.dll` 不新增
          # 运行时依赖。所以这一步不只是"少拷一个 dll"，它同时是"静态链接这个决定
          # 是否真的成立"的检验 —— 哪天它变回动态，这里就会红
          # （DLL 找不到 ⇒ 全部用例 `0xC0000135`）。
          # OpenSSL DLLs — uvcpp.dll links against them when a feature turns SSL on;
          # they must be findable next to the test executables.
          #
          # **这张位置表与 `.github/scripts/win-openssl-deps.sh` 里那张必须同表**
          # （那边把 "Install deps" 判定为"找到了"，这里才拷得到）；两处一起改。
          for ssl_dir in \
            "C:/Program Files/OpenSSL/bin" \
            "C:/Program Files/OpenSSL-Win64/bin" \
            "C:/Program Files (x86)/OpenSSL/bin" \
            "C:/Program Files/OpenSSL-Win32/bin"; do
            if [ -d "$ssl_dir" ]; then
              echo "Found OpenSSL DLLs in: $ssl_dir"
              for d in $test_dirs; do
                cp "$ssl_dir"/libssl-*.dll "$tree/$d/Release/" 2>/dev/null || true
                cp "$ssl_dir"/libcrypto-*.dll "$tree/$d/Release/" 2>/dev/null || true
              done
              break
            fi
          done

      # ★ 1.5.3：C ABI 这条腿同时开着 db 那一片，而"开没开成"在这格上**不会自己
      #   变红**。后端一个都没找到时守卫把 `UVCPP_ENABLE_DB` 强制关掉 ⇒ C 面的
      #   db 符号一条都不编 ⇒ 但配置照过、ctest 照旧全绿（`gate_test` 指的还是
      #   `test_capi_net_func`，它照样在）。判据三条，抄 `db` 那一格的三个门禁串：
      #   后端找到了、模块进了源列表、C 面的 db 用例注册了。
      #   为什么这一格要证明这个：MSVC 的 SQLite 是**从源码编**的，而那条路依赖
      #   配置期联网 —— 它断掉时上面三条会同时不成立，而**不成立不等于红**。
      - name: Gate — the C ABI leg really has the db slice open
        if: matrix.feature == 'capi'
        shell: bash
        run: |
          log="ci-logs/capi-configure.log"
          if [ ! -f "$log" ]; then
            echo "::error title=capi-db::找不到 $log —— 这条步骤依赖上面 configure 那步写的日志"
            ls -la ci-logs/ 2>/dev/null || true
            exit 1
          fi
          fail=0
          grep -q 'db: SQLite 后端开' "$log" || {
            echo "::error title=capi-db::配置日志里没有 'db: SQLite 后端开' —— SQLite 没找到（这一格是从源码编的，那条路要配置期联网），UVCPP_ENABLE_DB 会被守卫强制关掉，C 面的 db 符号一条都不编而整格全绿"
            grep -iE 'db|sqlite|warning' "$log" | head -20; fail=1; }
          grep -q 'Including db module in build' "$log" || {
            echo "::error title=capi-db::没有 'Including db module in build' —— src/db/ 没进源列表，C 面那 81 个符号编不出来"
            fail=1; }
          ctest --test-dir build-capi -N 2>/dev/null | grep -q 'test_capi_db_func' || {
            echo "::error title=capi-db::test_capi_db_func 没注册 —— 「模块被过滤掉了」和「用例跑过了」在 ctest 的输出里长得一样"
            ctest --test-dir build-capi -N 2>&1 | tail -30; fail=1; }
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "这一格同时开着 CAPI 与 DB：SQLite 编出来了、模块进了源列表、C 面的 db 用例注册了 —— C 面的 db 包装在 cl 下真的被编过一遍"

      - name: Test
        shell: bash
        run: |
          feat="${{ matrix.feature }}"
          tree="build-$feat"
          # 门禁 2：这一格的用例真的注册了。只跑 ctest 不足以发现"它们根本没被注册"——
          # 那种情况下总数少几个，而 ctest 照旧报 "100% tests passed"。
          if [ -n "${{ matrix.gate_test }}" ]; then
            if ! ctest --test-dir "$tree" -N 2>&1 | grep -q "${{ matrix.gate_test }}"; then
              echo "::error title=$feat::${{ matrix.gate_test }} 没被注册 —— 模块关了，还是 tests/functional/CMakeLists.txt 的过滤正则又写错了？"
              ctest --test-dir "$tree" -N 2>&1 | tail -20
              exit 1
            fi
          fi
          # Only test_shutdown_func is excluded (flaky ~1%, not hanging) — see
          # doc/ci-guide.md §4.
          rc=0
          out=$(ctest --test-dir "$tree" --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-$feat::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以把它折进注解 —— 否则
            # 注解里只有用例名，没有崩溃现场（断言文案 / 运行库的 `free(): invalid pointer`
            # 全在那段里）。
            #
            # 块的两端都承重：起点是那条 `***` 结果行，终点是下一条 `NN/MM Test #`
            # / `Start N:` / `N% tests passed` —— 不是"起点之后固定 30 行"。
            # **取头 20 行 + 尾 25 行**，因为崩溃现场在输出的**末尾**（进程是打印到
            # 一半死的）：只取头，对"输出比窗口长"的用例恰好把现场切掉，注解里剩下
            # 一串 `[ ok ]`，看不出崩在哪一句 —— 1.5.3 首次 macOS 的
            # `test_db_sqlite_pool_func` 就这么红的（注解正好 30 行，末行停在第 30 条
            # 断言上，第 31 行之后是什么无从得知）。
            #
            # awk **不 `exit`**：提前退出会让上面的 `printf` 吃 SIGPIPE，配上
            # `set -o pipefail` 就是"注解没打出来、步骤先死在赋值上"。`head` 那一支同理。
            blk=$(printf '%s\n' "$out" | awk '
              /^[0-9]+\/[0-9]+ Test #/ || /^ *Start [0-9]+: / || /^[0-9]+% tests passed/ { if (f) f = 0 }
              /\*\*\*/ { f = 1 }
              f { print }' | tr -d '\r')
            cnt=$(printf '%s\n' "$blk" | wc -l | tr -d ' ')
            if [ "$cnt" -gt 50 ]; then
              blk="$(printf '%s\n' "$blk" | head -20 || true)
              ……（中间 $((cnt - 45)) 行省略）……
              $(printf '%s\n' "$blk" | tail -25 || true)"
            fi
            blk=$(printf '%s\n' "$blk" | sed '/^[[:space:]]*$/d' | tr '\n' ' ' \
              | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-$feat-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # 使能宏契约（issue #6 第 3 条）的 MSVC/PE 那一档：出包 → 装 → 消费方。
  # linux/ELF 那一档在 ci-linux-ubuntu.yml，MinGW/PE 那一档在 ci-mingw64.yml 的
  # job 尾巴上。三档覆盖的是**头契约本身**，不是某个平台的运行时。
  #
  # 为什么单开一个 job：web/h2 那些格装的是系统 libuv 与系统 OpenSSL，而
  # package_release.py 要求 libuv 在构建树的 `_deps/` 里，否则按设计退 2、不产包。
  # 这里照 release.yml 的 msvc-x64 配置来（LIBUV_FROM_SOURCE=ON + OPENSSL=ON）——
  # 成员布局错位那一档只有 UVCPP_OPENSSL_ENABLE=1 时才真的会咬人。
  #
  # macOS **跑不了这条链**：package_release.py 的 PLATFORMS 里没有 macOS 的 key。
  # 这是已知缺口，记在 doc/ci-guide.md §5。
  # ---------------------------------------------------------------------------
  config-contract:
    name: CI · Windows · MSVC / config-contract
    # 钉 windows-2022 与 release.yml 的 msvc-x64 一致：windows-latest 现在指向只有
    # VS2026 的镜像，而 ilammy/msvc-dev-cmd 是按 vswhere -latest 找工具链的 ——
    # 让这个 job 的 MSVC 基线跟发布产物那条链不同源，出问题时没人能说清是哪一边的性质。
    runs-on: windows-2022
    timeout-minutes: 90
    # 脚本打印中文。python 写管道时按 locale 选编码（windows runner 是 cp1252）
    # ⇒ 在 print 那行 UnicodeEncodeError，看着像脚本 bug。显式钉成 UTF-8。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      # 与矩阵那四格同一个脚本、同一条判据（这一格钉的是 windows-2022，那里的
      # `choco install openssl` 与 windows-latest 上同一时刻开始恒非 0 退出 ——
      # 两张不同的镜像同时变，正是"变的是源那一边"的旁证）。
      - name: Install deps (Windows)
        shell: bash
        run: bash .github/scripts/win-openssl-deps.sh

      # cl.exe 不在 windows runner 的默认 PATH 上：CMake 自己找得到它，但 bash
      # 里没有。而下面的正例/反例**必须**是裸编译器调用 —— 走 CMake 的话
      # target_compile_definitions 发在 CMAKE_CXX_FLAGS 之后，冲突的那个 -D 会被
      # 盖掉（MSVC 只给 C4005 警告），生成头的 #error 根本不触发，判据 2 就成了摆设。
      - name: MSVC env (Windows)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure & Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            # 这一档照抄 release.yml 里 msvc 那份（它已经在真实发版里跑通了）：
            # **不加** PIC / OPENSSL_USE_STATIC_LIBS / STATIC_RUNTIME ——
            # choco 那份 OpenSSL 没有静态库，OPENSSL_USE_STATIC_LIBS=ON 会让
            # find_package 落空、UVCPP_ENABLE_OPENSSL 被静默降级成 OFF —— 于是
            # 判据 1 抓不到成员布局错位，而且下面那条断言会把这个 job 判红
            # （红得对，但红在开关抄错，不是红在被测对象）。
            # MSVC 侧 uvcpp 自己走 /MD + 包内自带 VC++ 运行库，不需要 STATIC_RUNTIME。
            #
            # `-DUVCPP_ENABLE_CAPI=ON` 与 release.yml 那六条腿一致：发布包里**有**
            # `include/capi/`，所以代表发布包的那棵树也得有 C 符号在库里。
            #
            # 数据库那四个 `-D` 同理，而且**已经被红过一次**：`doc/db-guide.md` 有
            # 5 条片段要 `db/uvcpp_db.h`，这一档不开模块时 `check_doc_snippets.py`
            # 把它们全判成"前提不满足"并退 3（2026-10-10 那轮 CI 的 windows 与
            # linux 两个 config-contract 就是这么红的）。四个开关与 release.yml 的
            # msvc 腿逐字相同 —— 包括 `UVCPP_DB_SQLITE_FROM_SOURCE=ON`：Windows 上
            # 本来就没有系统 sqlite3，发布腿走的就是这条路。
            echo "=== configure ==="
            cfg=0
            cmake -S . -B build-cfg -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DUVCPP_BUILD_LIBUV_FROM_SOURCE=ON \
              -DUVCPP_BUILD_TESTS=OFF -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_STATIC=OFF \
              -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
              -DUVCPP_ENABLE_ZLIB=ON -DUVCPP_ENABLE_OPENSSL=ON \
              -DUVCPP_ENABLE_NGHTTP2=ON \
              -DUVCPP_ENABLE_WSDL=ON \
              -DUVCPP_ENABLE_CAPI=ON \
              -DUVCPP_ENABLE_DB=ON -DUVCPP_DB_SQLITE_FROM_SOURCE=ON \
              -DUVCPP_ENABLE_DB_MYSQL=OFF -DUVCPP_ENABLE_DB_PGSQL=OFF \
              -DUVCPP_BUILD_EXPAND=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON > ci-logs/cfg-configure.log 2>&1 || cfg=$?
            echo "CONFIGURE_RC=$cfg"
            cat ci-logs/cfg-configure.log
            if [ "$cfg" != "0" ]; then exit "$cfg"; fi

            # 这个 job 的全部意义是"出包→装→消费方"那条链，所以先钉死包里
            # OPENSSL 真的是 1：不是 1 的话判据 1 抓不到布局错位，整条门禁
            # 会绿得毫无内容（而它自己看不出来）。
            grep -q '^#  define UVCPP_OPENSSL_ENABLE 1$' \
              build-cfg/include/uvcpp/uvcpp_config.h || {
              echo "::error title=config-contract::生成头里 UVCPP_OPENSSL_ENABLE 不是 1，判据 1 会退化成空转"; exit 1; }
            # 同理钉住 WSDL：doc-snippets 对 `wsdl/` 那一档的判据是"模块真的开着"，
            # 关着的话它会把 wsdl-guide.md 的片段全判成"没判"并退 3。
            grep -q '^#  define UVCPP_WSDL_ENABLE 1$' \
              build-cfg/include/uvcpp/uvcpp_config.h || {
              echo "::error title=config-contract::生成头里 UVCPP_WSDL_ENABLE 不是 1，doc-snippets 会把 wsdl 片段全判成\"没判\""; exit 1; }
            # 数据库：判生成的头而不是缓存 —— 三个后端一个都没成时模块被普通
            # `set()` 强制关闭，缓存里照旧是 ON 而编译器看到 0，那时 doc-snippets
            # 退 3，与"包缺模块"长得一样，分不出坏在哪一步（下载失败？哈希？）。
            grep -q '^#  define UVCPP_DB_ENABLE 1$' \
              build-cfg/include/uvcpp/uvcpp_config.h || {
              echo "::error title=config-contract::生成头里 UVCPP_DB_ENABLE 不是 1，doc-snippets 会把 db 片段全判成\"没判\"（SQLite 源码那份没编进来？见上面的配置日志）"; exit 1; }

            echo "=== build ==="
            bld=0
            cmake --build build-cfg --config Release --parallel 4 2>&1 \
              | tee ci-logs/cfg-build.log || bld=$?
            echo "BUILD_RC=$bld"
            if [ "$bld" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                ci-logs/cfg-build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
                | head -c 6000 || true)
              echo "::error title=build-cfg::${msg:-rc=$bld (no error line matched)}"
            fi

            # 调试档：另开一棵树，开关与上面**逐字相同**。VS 是多配置生成器
            # ⇒ 落在 build-cfg-dbg/Debug/；`-DCMAKE_BUILD_TYPE=Debug` 在这里被忽略，
            # 传它是为了让两档的 configure 行除了生成器之外完全一致。
            echo "=== debug configure + build ==="
            dbg=0
            cmake -S . -B build-cfg-dbg -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_SHARED_LIBS=OFF \
              -DUVCPP_BUILD_LIBUV_FROM_SOURCE=ON \
              -DUVCPP_BUILD_TESTS=OFF -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_STATIC=OFF \
              -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
              -DUVCPP_ENABLE_ZLIB=ON -DUVCPP_ENABLE_OPENSSL=ON \
              -DUVCPP_ENABLE_NGHTTP2=ON \
              -DUVCPP_ENABLE_WSDL=ON \
              -DUVCPP_ENABLE_CAPI=ON \
              -DUVCPP_ENABLE_DB=ON -DUVCPP_DB_SQLITE_FROM_SOURCE=ON \
              -DUVCPP_ENABLE_DB_MYSQL=OFF -DUVCPP_ENABLE_DB_PGSQL=OFF \
              -DUVCPP_BUILD_EXPAND=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON > ci-logs/cfg-dbg-configure.log 2>&1 || dbg=$?
            echo "DEBUG_CONFIGURE_RC=$dbg"
            if [ "$dbg" = "0" ]; then
              cmake --build build-cfg-dbg --config Debug --parallel 4 2>&1 \
                | tee ci-logs/cfg-dbg-build.log || dbg=$?
              echo "DEBUG_BUILD_RC=$dbg"
            fi
            if [ "$dbg" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                ci-logs/cfg-dbg-build.log ci-logs/cfg-dbg-configure.log 2>/dev/null \
                | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
              echo "::error title=build-cfg-dbg::${msg:-rc=$dbg (no error line matched)}"
            fi
            if [ "$bld" = "0" ]; then bld=$dbg; fi
            exit "$bld"
          } 2>&1 | tee ci-logs/cfg.log

      # 多行一律 `run: |`：普通标量会把续行折成空格，argparse 收不到 --tree 直接
      # 退 2，而且**退出码还是 0**（release.yml 里踩过一次，见 doc/ci-guide.md）。
      - name: Package
        shell: bash
        run: |
          python tests/tools/package_release.py \
            --tree build-cfg --platform msvc-x64 \
            --config Release --debug-tree build-cfg-dbg --out dist

      - name: Config contract (issue #6 item 3)
        shell: bash
        run: |
          pkg=$(ls -d dist/libuvcpp-*-msvc-x64 2>/dev/null | head -1)
          if [ -z "$pkg" ]; then
            echo "::error title=config-contract::没找到 msvc-x64 的包（出包那步没产出？）"
            exit 1
          fi
          echo "pkg=$pkg"
          rc=0
          out=$(python tests/tools/check_config_contract.py \
            --pkg "$pkg" --tree build-cfg --cxx cl 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -E '\[红\]|红 [0-9]+ 条|Error|Traceback' \
              | head -20 | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            echo "::error title=config-contract::${msg:-rc=$rc (no red line matched)}"
          fi
          exit "$rc"

      # 两条腿都开：MSVC 是本库的一等使用者平台，只跑 Linux 会漏掉正是 MSVC 才有的
      # 那类腐烂（编码、`/utf-8`、`/std:c++14` 与 C++11 的差）。本机没有 `cl`，
      # 所以这半条腿**只能靠 CI 验**；万一首跑因编码红，退路是先把这一步删掉，
      # 把判据留到编码路径验通再开 —— 退路写在这里，不许悄悄降级。
      - name: Doc snippets must compile
        shell: bash
        run: |
          pkg=$(ls -d dist/libuvcpp-*-msvc-x64 2>/dev/null | head -1)
          if [ -z "$pkg" ]; then
            echo "::error title=doc-snippets::没找到 msvc-x64 的包（出包那步没产出？）"
            exit 1
          fi
          echo "pkg=$pkg"
          rc=0
          out=$(python tests/tools/check_doc_snippets.py \
            --pkg "$pkg" --cxx cl 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            # `前提` 也进匹配：rc=3（片段因为包里缺模块而**没判**）与 rc=1（判红了）
            # 是两件事，注解里必须分得开。
            msg=$(printf '%s\n' "$out" \
              | grep -E '\[红\]|\[停\]|红 [0-9]+ 条|前提|Error|Traceback' \
              | head -20 | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            echo "::error title=doc-snippets::${msg:-rc=$rc (no red line matched)}"
          fi
          exit "$rc"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows-msvc-config-contract
          path: ci-logs/
          if-no-files-found: ignore
