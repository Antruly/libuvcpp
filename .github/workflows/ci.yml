name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # Basic: static + shared, web=OFF (Ubuntu + macOS)
  # ---------------------------------------------------------------------------
  basic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv ninja

      # README 顶上那几个版本号显示的是**当前源码树**的版本（`UVCPP_VERSION_STRING`，
      # 开发版带 `-dev`），所以这条在每次 push 上都真判，不分开发版/发布版：
      # 两条 README 必须一致 + 命中恰好 4 处 + 4 处都等于版本头。
      # 出包时 `package_release.py` 用 `--expect` 再调一次（`--version` 能覆盖头文件）。
      # rc=3 是「前提不满足、**没判**」，别读成「不一致」。
      - name: Check doc versions
        run: python3 tests/tools/check_doc_versions.py

      # 另外三条文档判据：① CMake 旋钮与两版 README 的选项表双向相等；
      # ② 文档里的相对链接与仓库路径都解析得到；③ doc/ 下没有被正文孤立的一篇。
      # 不碰构建、不调 git（MSYS2 那条 PATH 上没有 git），所以放这一档就够。
      # 同样：rc=3 是「前提不满足、**没判**」，别读成判红了。
      - name: Check docs
        run: python3 tests/tools/check_docs.py

      # 第四条文档判据：文档里写的 `文件:行号` 必须还指着它当初指的东西。
      #
      # 为什么非要有它：`check_docs.py` 判据 2 的 `LINE_SUFFIX_RE` 是**先把 `:NNN`
      # 剥掉再判文件存在** —— 行号那半从来没有工具校验。于是
      # 「改一行注释 -> 引用撞飞 -> 六道门禁全绿」是一条真实路径，而这批文档里
      # 有 674 条引用、其中上百条整条落在注释行上。
      #
      # 放**这一档**而不是 config-contract：它只读仓库本身（`doc/`、`src/`、
      # 锁文件），不需要包、不需要编译器，和上面那条同前提。而这一档有
      # ubuntu 这条**大小写敏感**的腿 —— 判据 1 要按真实文件系统解析路径，
      # 在 Windows/macOS 上拼错的路径也能命中（见 testing-guide 里那条）。
      - name: Check doc line references
        shell: bash
        run: |
          rc=0
          out=$(python3 tests/tools/check_doc_lines.py 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            # `空转`（一条引用都没扫到）与 `前提`（退 3、没判）都要进注解：
            # 它们和「判红了」是三件事，挤在一个 rc 里，只有注解能分开。
            msg=$(printf '%s\n' "$out" \
              | grep -E '\[红\]|\[停\]|红 [0-9]+ 条|前提|空转|Error|Traceback' \
              | head -20 | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            echo "::error title=doc-lines::${msg:-rc=$rc (no red line matched)}"
          fi
          exit "$rc"

      # 上面那条门禁**自己的**回归表：八种"引用被撞飞"的形状各造一遍，逐格
      # 对期望。为什么非要有它：那个门禁的判据是"前提 A 成立则判 B"，前提不
      # 成立时它不报错、只是**安静地走了另一条分支** —— 而"走了另一条分支"和
      # "判过了"在输出里长得一模一样。没有这张表，任何人把某个分支改成恒假都
      # 不会有人发现（实测：拆掉 `[胀]` 那条判据，门禁照样全绿）。
      # 只在临时目录里现造样例，不碰真仓库，和上面那条同前提。
      - name: Check doc line scenes (self-test of the gate above)
        shell: bash
        run: |
          rc=0
          out=$(python3 tests/tools/check_doc_lines_scenes.py 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" \
              | grep -E '不符|Traceback|Error' | head -20 | tr '\n' ' ' \
              | sed 's/%/%25/g' | head -c 6000 || true)
            echo "::error title=doc-lines-scenes::${msg:-rc=$rc (no red line matched)}"
          fi
          exit "$rc"

      - name: Configure & Build & Test (static)
        shell: bash
        run: |
          cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_STATIC=ON -DUVCPP_BUILD_SHARED=OFF \
            -DUVCPP_BUILD_WEB=OFF
          # 构建错误也折进注解。job 日志匿名读不到（/actions/jobs/<id>/logs 是 403），
          # `Upload build log` 的 artifact 下载同样要 token —— 剩下能读的只有注解。
          # 这一手是被 e3c0a0d 打的：四个 mac job 全挂在编译上（macOS 的 sigemptyset
          # 是宏，`::sigemptyset` 直接是语法错误），而本机 MSVC 整段跳过那个 `#if`，
          # 注解里只有一句 "exit code 2"，白等一轮。`set -o pipefail` 不能省：
          # 少了它 `cmake | tee` 的退出码是 tee 的 0，失败会被当成成功。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-static --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-static.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-static.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-static::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi
          # 失败用例名打成注解：job 日志从仓库外读不到（/actions/jobs/<id>/logs 要 token），注解匿名可读
          rc=0
          out=$(ctest --test-dir build-static --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-static::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-static-output::${blk}"
            fi
          fi
          exit "$rc"

      - name: Configure & Build & Test (shared)
        shell: bash
        run: |
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_STATIC=OFF -DUVCPP_BUILD_SHARED=ON \
            -DUVCPP_BUILD_WEB=OFF
          # 构建错误折进注解（说明见 static 步）。`set -o pipefail` 不能省。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-shared --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-shared.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-shared.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-shared::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi
          # 失败用例名打成注解（同 static 步）
          rc=0
          out=$(ctest --test-dir build-shared --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-shared::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-shared-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Windows basic: shared build only (static is covered by windows-static job)
  # ---------------------------------------------------------------------------
  windows-basic:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build
        shell: bash
        run: |
          # 同 full：内存池自 v1.1.0 起默认 OFF，这里显式打开，保住 MSVC/Windows
          # 侧的 test_memory_pool 覆盖 —— 内存池出问题的平台恰恰是 Windows。
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_STATIC=OFF -DUVCPP_BUILD_SHARED=ON \
            -DUVCPP_BUILD_WEB=OFF -DUVCPP_BUILD_EXPAND=ON
          # 构建错误折进注解（说明见 static 步）。`set -o pipefail` 不能省。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-shared --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-shared.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-shared.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-shared::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi

      - name: Copy runtime DLLs
        shell: bash
        run: |
          for d in tests/unit tests/functional tests/expand; do
            mkdir -p "build-shared/$d/Release"
            cp build-shared/Release/uvcpp.dll "build-shared/$d/Release/" 2>/dev/null || true
            cp build-shared/_deps/libuv-build/Release/uv.dll "build-shared/$d/Release/" 2>/dev/null || true
          done

      - name: Test
        shell: bash
        run: |
          # 失败用例名打成注解（同 basic 作业）
          rc=0
          out=$(ctest --test-dir build-shared --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-windows-basic::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-windows-basic-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Web: HTTP + WebSocket + webapp framework + zlib (all platforms)
  #
  # UVCPP_ENABLE_ZLIB must stay ON here: the webapp's compression tests assert
  # that gzip actually happens, so with zlib OFF those groups fail and the job
  # is testing a configuration nobody builds locally. zlib is FetchContent'd
  # when find_package misses, so this needs no extra dep on any platform.
  # ---------------------------------------------------------------------------
  web:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev zlib1g-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv zlib ninja

      # Configure and build are wrapped in one `log` group on purpose: with a
      # bare `bash -e` a configure failure kills the step and the only trace is
      # step stdout, which is unreadable from outside the repo (the log API
      # needs a token). Teeing to ci-logs/ and uploading it on failure means the
      # next red run hands over the actual compiler error text.  The
      # CONFIGURE_RC=/BUILD_RC= markers say which half died.
      - name: Configure & Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "=== toolchain ==="
            cmake --version
            echo "=== configure ==="
            cfg=0
            cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release \
              -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_WEB=ON \
              -DUVCPP_BUILD_WEBAPP=ON -DUVCPP_ENABLE_ZLIB=ON || cfg=$?
            echo "CONFIGURE_RC=$cfg"
            if [ "$cfg" != "0" ]; then exit "$cfg"; fi
            echo "=== resolved toolchain (CMakeCache) ==="
            grep -E '^(CMAKE_(GENERATOR|LINKER|CXX_COMPILER|C_COMPILER|VS_|MSVC)|MSVC_|OPENSSL_)' \
              build-web/CMakeCache.txt || true
            echo "=== build ==="
            bld=0
            cmake --build build-web --config Release --parallel 4 2>&1 \
              | tee ci-logs/build-web-build.log || bld=$?
            echo "BUILD_RC=$bld"
            # 构建错误折进注解（说明见 static 步）：这个 job 的 artifact 下载也要
            # token，日志照样读不到，注解是唯一出口。
            if [ "$bld" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                ci-logs/build-web-build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
                | head -c 6000 || true)
              echo "::error title=build-web::${msg:-rc=$bld (no error line matched)}"
            fi
            exit "$bld"
          } 2>&1 | tee ci-logs/build-web.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-web-${{ matrix.os }}
          path: ci-logs/
          if-no-files-found: ignore

      - name: Copy runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in tests/unit tests/functional tests/expand; do
            mkdir -p "build-web/$d/Release"
            cp build-web/Release/uvcpp.dll "build-web/$d/Release/" 2>/dev/null || true
            cp build-web/_deps/libuv-build/Release/uv.dll "build-web/$d/Release/" 2>/dev/null || true
            # llhttp — built as shared when BUILD_SHARED_LIBS=ON
            cp build-web/_deps/llhttp-build/Release/llhttp.dll "build-web/$d/Release/" 2>/dev/null || true
            cp build-web/_deps/llhttp-build/llhttp.dll "build-web/$d/Release/" 2>/dev/null || true
          done

      - name: Test
        shell: bash
        run: |
          # Only test_shutdown_func is excluded: it is flaky (~1%), not hanging.
          # test_tcp_func and test_memory_pool were excluded for defects that are
          # long fixed (see doc/ci-guide.md §4) — they run, and must stay green.
          rc=0
          out=$(ctest --test-dir build-web --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-web::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-web-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # SSL: Web + webapp + OpenSSL + zlib (all platforms)
  #
  # Same reasoning as the web job: the webapp's compression tests need
  # UVCPP_ENABLE_ZLIB=ON, and the locally validated TLS tree (build-ssl) has
  # zlib ON.  Off, this job would fail the same two gzip groups.
  # ---------------------------------------------------------------------------
  ssl:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libssl-dev zlib1g-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv openssl zlib ninja

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --no-progress

      - name: Configure & Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "=== toolchain ==="
            cmake --version
            openssl version 2>/dev/null || echo "(openssl not on PATH)"
            echo "=== configure ==="
            cfg=0
            cmake -S . -B build-ssl -DCMAKE_BUILD_TYPE=Release \
              -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_SHARED=ON \
              -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON -DUVCPP_ENABLE_OPENSSL=ON \
              -DUVCPP_ENABLE_ZLIB=ON || cfg=$?
            echo "CONFIGURE_RC=$cfg"
            if [ "$cfg" != "0" ]; then exit "$cfg"; fi
            echo "=== resolved toolchain (CMakeCache) ==="
            grep -E '^(CMAKE_(GENERATOR|LINKER|CXX_COMPILER|C_COMPILER|VS_|MSVC)|MSVC_|OPENSSL_)' \
              build-ssl/CMakeCache.txt || true
            echo "=== build ==="
            bld=0
            cmake --build build-ssl --config Release --parallel 4 2>&1 \
              | tee ci-logs/build-ssl-build.log || bld=$?
            echo "BUILD_RC=$bld"
            # 构建错误折进注解（说明见 static 步）：artifact 下载要 token，
            # 注解是唯一读得到的出口。
            if [ "$bld" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                ci-logs/build-ssl-build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
                | head -c 6000 || true)
              echo "::error title=build-ssl::${msg:-rc=$bld (no error line matched)}"
            fi
            exit "$bld"
          } 2>&1 | tee ci-logs/build-ssl.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ssl-${{ matrix.os }}
          path: ci-logs/
          if-no-files-found: ignore

      - name: Copy runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in tests/unit tests/functional tests/expand; do
            mkdir -p "build-ssl/$d/Release"
            # uvcpp + libuv + llhttp (llhttp built as shared when BUILD_SHARED_LIBS=ON)
            cp build-ssl/Release/uvcpp.dll "build-ssl/$d/Release/" 2>/dev/null || true
            cp build-ssl/_deps/libuv-build/Release/uv.dll "build-ssl/$d/Release/" 2>/dev/null || true
            cp build-ssl/_deps/llhttp-build/Release/llhttp.dll "build-ssl/$d/Release/" 2>/dev/null || true
            cp build-ssl/_deps/llhttp-build/llhttp.dll "build-ssl/$d/Release/" 2>/dev/null || true
          done
          # OpenSSL DLLs — uvcpp.dll links against them; they must be findable
          for ssl_dir in \
            "C:/Program Files/OpenSSL/bin" \
            "C:/Program Files/OpenSSL-Win64/bin" \
            "C:/Program Files (x86)/OpenSSL/bin" \
            "C:/Program Files/OpenSSL-Win32/bin"; do
            if [ -d "$ssl_dir" ]; then
              echo "Found OpenSSL DLLs in: $ssl_dir"
              for d in tests/unit tests/functional tests/expand; do
                cp "$ssl_dir"/libssl-*.dll "build-ssl/$d/Release/" 2>/dev/null || true
                cp "$ssl_dir"/libcrypto-*.dll "build-ssl/$d/Release/" 2>/dev/null || true
              done
              break
            fi
          done

      - name: Test
        shell: bash
        run: |
          # Only test_shutdown_func is excluded (flaky ~1%, not hanging) — see the
          # web job above and doc/ci-guide.md §4.
          rc=0
          out=$(ctest --test-dir build-ssl --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-ssl::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-ssl-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # H2: Web + WebApp + OpenSSL + zlib + nghttp2
  # ---------------------------------------------------------------------------
  # **这个 job 存在的唯一理由是"别让它绿得没有内容"。** `UVCPP_ENABLE_NGHTTP2`
  # 默认 OFF，所以上面每一个 job 都**不编译 `src/http2/`** —— 少了这一条，一整块
  # HTTP/2 代码可以带着 CI 全绿推上去而从未被编译过一次。
  #
  # 因此下面有两处**门禁**，而不是只靠 "构建/测试没报错"：配置之后核缓存里那个
  # 开关真的是 ON、且消息里真的出现了 "nghttp2 integrated"；测试之前核 h2 用例
  # **真的被注册了**（`ctest -N`）。理由见 `doc/ci-guide.md`：nghttp2 关掉时
  # `h2_*` 用例会走 `#else` 那条只打印 SKIP 的 `main()` 并且**返回 0** ——
  # 一个"没测"的东西在 ctest 里的长相与"通过"完全一致（本仓库真的栽过一次，
  # 那次是 `tests/functional/CMakeLists.txt` 的过滤正则写成了 `^h2_`，
  # 而 `file(GLOB)` 给的是全路径，永远匹配不上）。
  h2:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libssl-dev zlib1g-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv openssl zlib ninja

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --no-progress

      - name: Configure & Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "=== toolchain ==="
            cmake --version
            openssl version 2>/dev/null || echo "(openssl not on PATH)"
            echo "=== configure ==="
            cfg=0
            cmake -S . -B build-h2 -DCMAKE_BUILD_TYPE=Release \
              -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_SHARED=ON \
              -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON -DUVCPP_ENABLE_OPENSSL=ON \
              -DUVCPP_ENABLE_ZLIB=ON -DUVCPP_ENABLE_NGHTTP2=ON \
              > ci-logs/build-h2-configure.log 2>&1 || cfg=$?
            echo "CONFIGURE_RC=$cfg"
            cat ci-logs/build-h2-configure.log
            if [ "$cfg" != "0" ]; then exit "$cfg"; fi

            # 门禁 1：nghttp2 **真的**被集成了。三条判据缺一不可 ——
            #   ① 缓存里开关是 ON（用户传了，但可能被强制关掉：本工程有一条
            #      "NGHTTP2=ON 但 OPENSSL=OFF 就 warn + 强制关" 的从属规则）；
            #   ② CMakeLists 真的打出了 "nghttp2 integrated"（FetchContent 走通）；
            #   ③ `src/http2/` 真的进了源列表。
            # 少任何一条，这个 job 都会去编一个**不带 HTTP/2** 的库然后全绿。
            grep -q 'UVCPP_ENABLE_NGHTTP2:BOOL=ON' build-h2/CMakeCache.txt || {
              echo "::error title=h2::CMakeCache 里 UVCPP_ENABLE_NGHTTP2 不是 ON —— 这个 job 没在测 HTTP/2"; exit 1; }
            grep -q 'nghttp2 integrated' ci-logs/build-h2-configure.log || {
              echo "::error title=h2::配置消息里没有 'nghttp2 integrated' —— nghttp2 没被集成"; exit 1; }
            grep -q 'Including http2 module in build' ci-logs/build-h2-configure.log || {
              echo "::error title=h2::src/http2/ 没进源列表 —— 编出来的库不含 HTTP/2"; exit 1; }

            echo "=== resolved toolchain (CMakeCache) ==="
            grep -E '^(CMAKE_(GENERATOR|LINKER|CXX_COMPILER|C_COMPILER|VS_|MSVC)|MSVC_|OPENSSL_|NGHTTP2_)' \
              build-h2/CMakeCache.txt || true
            echo "=== build ==="
            bld=0
            cmake --build build-h2 --config Release --parallel 4 2>&1 \
              | tee ci-logs/build-h2-build.log || bld=$?
            echo "BUILD_RC=$bld"
            if [ "$bld" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                ci-logs/build-h2-build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
                | head -c 6000 || true)
              echo "::error title=build-h2::${msg:-rc=$bld (no error line matched)}"
            fi
            exit "$bld"
          } 2>&1 | tee ci-logs/build-h2.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-h2-${{ matrix.os }}
          path: ci-logs/
          if-no-files-found: ignore

      - name: Copy runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in tests/unit tests/functional tests/expand; do
            mkdir -p "build-h2/$d/Release"
            cp build-h2/Release/uvcpp.dll "build-h2/$d/Release/" 2>/dev/null || true
            cp build-h2/_deps/libuv-build/Release/uv.dll "build-h2/$d/Release/" 2>/dev/null || true
            cp build-h2/_deps/llhttp-build/Release/llhttp.dll "build-h2/$d/Release/" 2>/dev/null || true
            cp build-h2/_deps/llhttp-build/llhttp.dll "build-h2/$d/Release/" 2>/dev/null || true
          done
          # **nghttp2 这里刻意没有 cp**：它被压成静态（`nghttp2_static` +
          # `NGHTTP2_STATICLIB`），`uvcpp.dll` 不新增运行时依赖。所以这个 job
          # 不只是"少拷一个 dll"，它同时是"静态链接这个决定是否真的成立"的检验 ——
          # 哪天它变回动态，下面 OpenSSL 之后那个导入表自检就该在这里红。
          for ssl_dir in \
            "C:/Program Files/OpenSSL/bin" \
            "C:/Program Files/OpenSSL-Win64/bin" \
            "C:/Program Files (x86)/OpenSSL/bin" \
            "C:/Program Files/OpenSSL-Win32/bin"; do
            if [ -d "$ssl_dir" ]; then
              echo "Found OpenSSL DLLs in: $ssl_dir"
              for d in tests/unit tests/functional tests/expand; do
                cp "$ssl_dir"/libssl-*.dll "build-h2/$d/Release/" 2>/dev/null || true
                cp "$ssl_dir"/libcrypto-*.dll "build-h2/$d/Release/" 2>/dev/null || true
              done
              break
            fi
          done

      - name: Test
        shell: bash
        run: |
          # 门禁 2：h2 用例真的注册了。只跑 ctest 不足以发现"它们根本没被注册" ——
          # 那种情况下总数少几个，而 ctest 照旧报 "100% tests passed"。
          if ! ctest --test-dir build-h2 -N 2>&1 | grep -q "test_h2_session_func"; then
            echo "::error title=h2::test_h2_session_func 没被注册 —— nghttp2 关了，还是 tests/functional/CMakeLists.txt 的过滤正则又写错了？"
            ctest --test-dir build-h2 -N 2>&1 | tail -20
            exit 1
          fi
          # Only test_shutdown_func is excluded (flaky ~1%, not hanging) — see
          # doc/ci-guide.md §4.
          rc=0
          out=$(ctest --test-dir build-h2 --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-h2::${msg:-rc=$rc (no FAILED block)}"
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-h2-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Full: Web + OpenSSL + zlib (Ubuntu + macOS)
  # ---------------------------------------------------------------------------
  full:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libssl-dev zlib1g-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv openssl zlib ninja

      - name: Configure & Build & Test
        shell: bash
        run: |
          # UVCPP_BUILD_EXPAND 自 v1.1.0 起默认 OFF（默认开时，使用者 TU 忘了定义
          # UVCPP_ENABLE_MEMORY_POOL 会静默拿到与 dll 不同的分配器 —— 见 RELEASE.md）。
          # 这里显式打开：不打开的话 tests/expand 那批用例在 CI 里一条都不跑，
          # 内存池就成了没人测的死代码。别顺手把这行删掉。
          cmake -S . -B build-full -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_SHARED=ON \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_ENABLE_OPENSSL=ON -DUVCPP_ENABLE_ZLIB=ON \
            -DUVCPP_BUILD_EXPAND=ON
          # 构建错误折进注解（说明见 static 步）。`set -o pipefail` 不能省。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-full --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-full.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-full.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-full::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi
          # 失败用例名打成注解（同 basic 作业）
          rc=0
          out=$(ctest --test-dir build-full --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-full::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-full-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # MinGW-w64: 发布产物用的正是这条工具链，所以它的测试覆盖不能只靠开发机。
  #
  # 三个必须守住的点：
  #   1. **UVCPP_BUILD_EXPAND=ON 要显式写**。内存池自 v1.1.0 起默认 OFF，不写这行
  #      的话 tests/expand 一条都不跑，池就成了没人测的死代码。MinGW 恰恰是历史
  #      上唯一出过问题（emutls + thread_local 析构）的平台，更不能省。
  #   2. **UVCPP_STATIC_RUNTIME=ON + OPENSSL_USE_STATIC_LIBS=ON**，与 release.yml
  #      的 mingw-x64 逐字对齐 —— 这个 job 的价值就在于它是发布配置的哨兵。
  #      发布用的 libuvcpp.dll 除了 Windows 系统库之外不能有任何依赖；这条靠开关
  #      而不是靠"记得传 -DCMAKE_*_LINKER_FLAGS"。job 末尾还会 objdump 一遍把
  #      这条断言钉死（白名单形式，见那段注释）。
  #   3. **别手动往测试目录拷 DLL**。copy_test_dlls 覆盖 tests/{unit,functional,
  #      expand} 与 examples/，含 Ninja 单配置树（早先它把 $<CONFIG> 展开成
  #      Release，拷进了没人读的目录）。手工再拷一份只会掩盖它再次失效。
  #
  #      这个 job 第一次跑就是这么红的：全部 79 个用例 0.01 秒内以
  #      STATUS_DLL_NOT_FOUND 退出 —— copy_test_dlls 当时是个**不带 ALL** 的
  #      自定义目标，`cmake --build .` 根本不跑它。本机没暴露，是因为验证时敲的是
  #      `--target copy_test_dlls`。已改成 ALL（CMakeLists.txt 里那段有注释）。
  # ---------------------------------------------------------------------------
  mingw64:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-python

      - name: Configure & Build
        run: |
          set -o pipefail
          mkdir -p ci-logs
          # 两个都是"依赖必须静态进去"的开关，缺一个产物就多一个 dll 依赖，
          # 和"任意 64 位 Windows 直接可用"的发布承诺冲突。下面那条断言两个都抓得到，
          # 这条注释是让下次改的人知道该传什么、以及为什么本机看不出来。
          #
          # ① -DUVCPP_BUILD_LIBUV_FROM_SOURCE=ON —— 本机看不出来的真正原因在这里：
          #   CMakePresets.json:22 有这个开关，而本机所有树都是走 preset 配置的，
          #   所以一直链的是 FetchContent 的静态 libuv。CI 是裸 `cmake -S . -B`，
          #   不带 preset ⇒ 这个开关默认 OFF ⇒ `find_library` 在 MSYS2 里撞上
          #   C:/msys64/mingw64/lib/libuv.dll.a（runner 镜像自带 libuv）⇒ 链成
          #   共享库，产物依赖 `libuv-1.dll`（MSYS2 那份的 DLL 名带 -1）。
          #   注意 `BUILD_SHARED_LIBS` 在这一路上救不了场：CMakeLists.txt:275 判的是
          #   `TARGET uv_a`，而 find_library 给的是一个**路径**，不是 target，
          #   所以那个分支根本进不去。
          #
          # ② -DBUILD_SHARED_LIBS=OFF —— 管 llhttp（根 CMakeLists.txt:6 默认 ON ⇒
          #   llhttp_shared ⇒ 依赖 libllhttp.dll）。它不管 uvcpp 自己
          #   （CMakeLists.txt:485 是显式的 `add_library(uvcpp SHARED ...)`）。
          #   本地 A/B 过：OFF 时链接行是 `_deps/llhttp-build/libllhttp.a`，ON 时是
          #   `libllhttp.dll.a`。装到 FetchContent 的 libuv 上时它顺带也管 libuv
          #   （275 行挑 `uv_a`），但那一路在 CI 上本来就走不到。
          cmake -S . -B build-mingw -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DUVCPP_BUILD_LIBUV_FROM_SOURCE=ON \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_STATIC=OFF \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_ZLIB=ON -DUVCPP_ENABLE_OPENSSL=ON \
            -DUVCPP_BUILD_EXPAND=ON -DUVCPP_STATIC_RUNTIME=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON 2>&1 \
            | tee ci-logs/mingw-configure.log
          bld=0
          cmake --build build-mingw --parallel 4 2>&1 | tee ci-logs/mingw-build.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/mingw-build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-mingw::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi

          # 调试档：另开一棵单配置树，开关与上面**逐字相同** —— 这里最容易漏的是
          # 上面①②那两条依赖静态的开关，漏了就只有调试档多出 dll 依赖，而它恰恰
          # 是使用者拿去调试时才会撞上的那份。`-DUVCPP_BUILD_TESTS=OFF`：这条腿要
          # 的是**产物**，调试档的测试不在这里跑（理由见 RELEASE.md「Debug 版前提」）。
          cmake -S . -B build-mingw-dbg -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SHARED_LIBS=OFF \
            -DUVCPP_BUILD_LIBUV_FROM_SOURCE=ON \
            -DUVCPP_BUILD_TESTS=OFF -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_STATIC=OFF \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
            -DUVCPP_ENABLE_ZLIB=ON -DUVCPP_ENABLE_OPENSSL=ON \
            -DUVCPP_BUILD_EXPAND=ON -DUVCPP_STATIC_RUNTIME=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON 2>&1 \
            | tee ci-logs/mingw-dbg-configure.log
          bld=0
          cmake --build build-mingw-dbg --parallel 4 2>&1 \
            | tee ci-logs/mingw-dbg-build.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/mingw-dbg-build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-mingw-dbg::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi

      - name: Assert the DLL is self-contained
        run: |
          # 发布承诺是"任意 64 位 Windows 直接可用"。这条不是风格问题：一旦
          # UVCPP_STATIC_RUNTIME / OPENSSL_USE_STATIC_LIBS 被改坏或漏传，产物在
          # 开发机上照样跑得动，换台机器才 0xc0000135 —— 只有在这里断言才拦得住。
          #
          # 白名单，不是黑名单：黑名单原先只 grep libgcc|libstdc|libwinpthread，
          # 而 MSYS2 同时装了 libssl.a 和 libssl.dll.a，find_library 默认挑 .dll.a
          # ⇒ 产物会多一个 libssl-3-x64.dll 而断言照样放行。
          # 两份都要过：调试档是**另一次 configure**，上面①②任何一条漏传，
          # 就只有那一份多出 dll 依赖 —— 只查发布档会把它放过去。
          rc=0
          for d in build-mingw/libuvcpp.dll build-mingw-dbg/libuvcppd.dll; do
            echo "--- $d"
            deps=$(objdump -p "$d" | awk '/DLL Name/ {print $3}' | sort -u)
            echo "$deps"
            bad=$(echo "$deps" | grep -viE '^(ADVAPI32|bcrypt|bcryptprimitives|CRYPT32|dbghelp|DNSAPI|IPHLPAPI|KERNEL32|msvcrt|ntdll|ole32|PSAPI|RPCRT4|SECUR32|SHELL32|SHLWAPI|USER32|USERENV|WINMM|WS2_32|api-ms-win-[a-z0-9-]+)\.dll$' || true)
            if [ -n "$bad" ]; then
              echo "::error title=mingw-not-self-contained::$d 依赖了非 Windows 自带的模块: $bad"
              rc=1
            fi
          done
          exit $rc

      - name: Test
        run: |
          rc=0
          out=$(ctest --test-dir build-mingw --output-on-failure \
            --timeout 60 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-mingw::${msg:-rc=$rc (no FAILED block)}"
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-mingw-output::${blk}"
            fi
          fi
          exit "$rc"

      # 出包 → 装 → 消费方（issue #6 第 3 条）。这条腿是 MinGW/PE 那一档：
      # 这棵树本来就是按发布规格配的（OPENSSL=ON / LIBUV_FROM_SOURCE=ON），
      # 成员布局错位那一档在这里是活的。
      # 路径一律用**相对**的：MSYS2 bash 把 `/d/...` 形状的实参喂给原生 python 时
      # 会做路径转换，相对路径不经过那一步。
      - name: Package & config contract (issue #6 item 3)
        env:
          # 两个脚本都打印中文。原生 python 写管道时按 locale 选编码
          # （runner 上是 cp1252）⇒ UnicodeEncodeError 直接在打印那行崩掉，
          # 看着像脚本 bug。MSYS2 是否默认 UTF-8 不在我们控制之内，显式钉住。
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          rc=0
          out=$(python tests/tools/package_release.py \
            --tree build-mingw --platform mingw-x64 \
            --debug-tree build-mingw-dbg --out dist 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" \
              | grep -E 'error|Error|缺少|失败|Traceback' | head -20 \
              | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            echo "::error title=package-mingw::${msg:-rc=$rc (no error line matched)}"
            exit "$rc"
          fi
          pkg=$(ls -d dist/libuvcpp-*-mingw-x64 2>/dev/null | head -1)
          if [ -z "$pkg" ]; then
            echo "::error title=config-contract::出包那步没产出 mingw-x64 的包"
            exit 1
          fi
          echo "pkg=$pkg"
          rc=0
          out=$(python tests/tools/check_config_contract.py \
            --pkg "$pkg" --tree build-mingw --cxx g++ 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -E '\[红\]|红 [0-9]+ 条|Error|Traceback' \
              | head -20 | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            echo "::error title=config-contract::${msg:-rc=$rc (no red line matched)}"
          fi
          exit "$rc"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mingw64
          path: ci-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Windows static: MSVC static build (web=OFF, no shared lib)
  # ---------------------------------------------------------------------------
  windows-static:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build
        shell: bash
        run: |
          cmake -S . -B build-msvc -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_STATIC=ON -DUVCPP_BUILD_SHARED=OFF \
            -DUVCPP_BUILD_WEB=OFF
          # 构建错误折进注解（说明见 static 步）。`set -o pipefail` 不能省。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-msvc --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-msvc.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-msvc.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-msvc::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi

      - name: Copy runtime DLLs
        shell: bash
        run: |
          for d in tests/unit tests/functional tests/expand; do
            mkdir -p "build-msvc/$d/Release"
            cp build-msvc/_deps/libuv-build/Release/uv.dll "build-msvc/$d/Release/" 2>/dev/null || true
          done

      - name: Test
        shell: bash
        run: |
          rc=0
          out=$(ctest --test-dir build-msvc --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-msvc::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-msvc-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # 使能宏契约（issue #6 第 3 条）：出包 → 装 → 消费方
  #
  # 为什么单开一个 job 而不挂在 web/h2 的腿上：那两条腿在 ubuntu 上装的是
  # `libuv1-dev`（系统 libuv），而 package_release.py 要求 libuv 在构建树的
  # `_deps/` 里，否则按设计判"缺少必需文件"退 2、不产包。这里照 release.yml 的
  # 配置来（LIBUV_FROM_SOURCE=ON），且 **OPENSSL 也开着** —— 成员布局错位那一档
  # （`ssl_ctx_` 声明在 `http_`/`registry_` 之前）只有 UVCPP_OPENSSL_ENABLE=1 时
  # 才真的会咬人，关着编出来的包会把判据 1 退化成空转。
  #
  # 三档工具链覆盖的是**头契约本身**，不是某个平台的运行时：
  #   ubuntu -> gcc/ELF     windows -> MSVC/PE      mingw64 -> MinGW/PE（在那个 job 里）
  #
  # macOS **跑不了这条链**：package_release.py 的 PLATFORMS 里没有 macOS 的 key。
  # 这是已知缺口，记在 doc/ci-guide.md。
  # ---------------------------------------------------------------------------
  config-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # 脚本打印中文。python 写管道时按 locale 选编码（ubuntu 的 C locale 是
    # ASCII、windows runner 是 cp1252）⇒ 在 print 那行 UnicodeEncodeError，
    # 看着像脚本 bug。显式钉成 UTF-8，两个平台一视同仁。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            cxx: g++
            py: python3
          # 钉 windows-2022 与 release.yml 的 msvc-x64 一致：windows-latest 现在
          # 指向只有 VS2026 的镜像，而 ilammy/msvc-dev-cmd 是按 vswhere -latest
          # 找工具链的 —— 让这个 job 的 MSVC 基线跟发布产物那条链不同源，
          # 出问题时没人能说清是哪一边的性质。
          - os: windows-2022
            platform: msvc-x64
            cxx: cl
            py: python
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev ninja-build pkg-config

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --no-progress

      # cl.exe 不在 windows runner 的默认 PATH 上：CMake 自己找得到它，但 bash
      # 里没有。而下面的正例/反例**必须**是裸编译器调用 —— 走 CMake 的话
      # target_compile_definitions 发在 CMAKE_CXX_FLAGS 之后，冲突的那个 -D 会被
      # 盖掉（MSVC 只给 C4005 警告），生成头的 #error 根本不触发，判据 2 就成了摆设。
      - name: MSVC env (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure & Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            # 这两档**不是**同一套开关，照抄 release.yml 里各自那份（它已经在
            # 真实发版里跑通了）：
            #   linux  -> 依赖全静态（PIC + OPENSSL_USE_STATIC_LIBS + STATIC_RUNTIME）
            #   msvc   -> **不加**后两个：choco 那份 OpenSSL 没有静态库，
            #             OPENSSL_USE_STATIC_LIBS=ON 会让 find_package 落空、
            #             UVCPP_ENABLE_OPENSSL 被静默降级成 OFF —— 于是判据 1
            #             抓不到成员布局错位，而且下面那条断言会把这个 job 判红
            #             （红得对，但红在开关抄错，不是红在被测对象）。
            #             MSVC 侧 uvcpp 自己走 /MD + 包内自带 VC++ 运行库，
            #             不需要 STATIC_RUNTIME。
            echo "=== configure ==="
            cfg=0
            extra=()
            if [ "$RUNNER_OS" = "Linux" ]; then
              extra+=(-DCMAKE_POSITION_INDEPENDENT_CODE=ON
                      -DOPENSSL_USE_STATIC_LIBS=ON -DUVCPP_STATIC_RUNTIME=ON)
            fi
            cmake -S . -B build-cfg -DCMAKE_BUILD_TYPE=Release "${extra[@]}" \
              -DBUILD_SHARED_LIBS=OFF \
              -DUVCPP_BUILD_LIBUV_FROM_SOURCE=ON \
              -DUVCPP_BUILD_TESTS=OFF -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_STATIC=OFF \
              -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
              -DUVCPP_ENABLE_ZLIB=ON -DUVCPP_ENABLE_OPENSSL=ON \
              -DUVCPP_ENABLE_NGHTTP2=ON \
              -DUVCPP_BUILD_EXPAND=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON > ci-logs/cfg-configure.log 2>&1 || cfg=$?
            echo "CONFIGURE_RC=$cfg"
            cat ci-logs/cfg-configure.log
            if [ "$cfg" != "0" ]; then exit "$cfg"; fi

            # 这个 job 的全部意义是"出包→装→消费方"那条链，所以先钉死包里
            # OPENSSL 真的是 1：不是 1 的话判据 1 抓不到布局错位，整条门禁
            # 会绿得毫无内容（而它自己看不出来）。
            grep -q '^#  define UVCPP_OPENSSL_ENABLE 1$' \
              build-cfg/include/uvcpp/uvcpp_config.h || {
              echo "::error title=config-contract::生成头里 UVCPP_OPENSSL_ENABLE 不是 1，判据 1 会退化成空转"; exit 1; }

            echo "=== build ==="
            bld=0
            cmake --build build-cfg --config Release --parallel 4 2>&1 \
              | tee ci-logs/cfg-build.log || bld=$?
            echo "BUILD_RC=$bld"
            if [ "$bld" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                ci-logs/cfg-build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
                | head -c 6000 || true)
              echo "::error title=build-cfg::${msg:-rc=$bld (no error line matched)}"
            fi

            # 调试档：另开一棵树，开关与上面**逐字相同**（含 Linux 那三个 extra）。
            # Windows 上是 VS 多配置生成器 ⇒ 落在 build-cfg-dbg/Debug/；Linux 上是
            # 单配置 ⇒ `-DCMAKE_BUILD_TYPE=Debug` 生效。两种都传，哪个起作用由
            # 生成器决定（MSVC 的 `-DCMAKE_BUILD_TYPE` 被忽略，多配置不看它）。
            echo "=== debug configure + build ==="
            dbg=0
            cmake -S . -B build-cfg-dbg -DCMAKE_BUILD_TYPE=Debug "${extra[@]}" \
              -DBUILD_SHARED_LIBS=OFF \
              -DUVCPP_BUILD_LIBUV_FROM_SOURCE=ON \
              -DUVCPP_BUILD_TESTS=OFF -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_STATIC=OFF \
              -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON \
              -DUVCPP_ENABLE_ZLIB=ON -DUVCPP_ENABLE_OPENSSL=ON \
              -DUVCPP_ENABLE_NGHTTP2=ON \
              -DUVCPP_BUILD_EXPAND=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON > ci-logs/cfg-dbg-configure.log 2>&1 || dbg=$?
            echo "DEBUG_CONFIGURE_RC=$dbg"
            if [ "$dbg" = "0" ]; then
              cmake --build build-cfg-dbg --config Debug --parallel 4 2>&1 \
                | tee ci-logs/cfg-dbg-build.log || dbg=$?
              echo "DEBUG_BUILD_RC=$dbg"
            fi
            if [ "$dbg" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                ci-logs/cfg-dbg-build.log ci-logs/cfg-dbg-configure.log 2>/dev/null \
                | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
              echo "::error title=build-cfg-dbg::${msg:-rc=$dbg (no error line matched)}"
            fi
            if [ "$bld" = "0" ]; then bld=$dbg; fi
            exit "$bld"
          } 2>&1 | tee ci-logs/cfg.log

      # 多行一律 `run: |`：普通标量会把续行折成空格，argparse 收不到 --tree 直接
      # 退 2，而且**退出码还是 0**（release.yml 里踩过一次，见 doc/ci-guide.md）。
      - name: Package
        shell: bash
        run: |
          ${{ matrix.py }} tests/tools/package_release.py \
            --tree build-cfg --platform ${{ matrix.platform }} \
            --config Release --debug-tree build-cfg-dbg --out dist

      - name: Config contract (issue #6 item 3)
        shell: bash
        run: |
          pkg=$(ls -d dist/libuvcpp-*-${{ matrix.platform }} 2>/dev/null | head -1)
          if [ -z "$pkg" ]; then
            echo "::error title=config-contract::没找到 ${{ matrix.platform }} 的包（出包那步没产出？）"
            exit 1
          fi
          echo "pkg=$pkg"
          rc=0
          out=$(${{ matrix.py }} tests/tools/check_config_contract.py \
            --pkg "$pkg" --tree build-cfg --cxx ${{ matrix.cxx }} 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -E '\[红\]|红 [0-9]+ 条|Error|Traceback' \
              | head -20 | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            echo "::error title=config-contract::${msg:-rc=$rc (no red line matched)}"
          fi
          exit "$rc"

      # 挂在**这一档**的理由：它是唯一同时满足"六个模块全 ON、真的产出一个包、
      # 有 python、且 matrix 里同时有 g++ 与 cl 两条腿"的 job。门禁要的就是一个
      # 全开的包 —— 关着模块的包只会让它把大半片段判成"跳过"（退 3），判不出东西。
      #
      # 两条腿都开：MSVC 是本库的一等使用者平台，只跑 Linux 会漏掉正是 MSVC 才有的
      # 那类腐烂（编码、`/utf-8`、`/std:c++14` 与 C++11 的差）。本机没有 `cl`，
      # 所以那半条腿**只能靠 CI 验**；万一首跑因编码红，退路是先把这一步收到
      # `if: runner.os == 'Linux'`，把 MSVC 那条腿留到编码路径验通再开 ——
      # 退路要写在这里，不许悄悄降级。
      - name: Doc snippets must compile
        shell: bash
        run: |
          pkg=$(ls -d dist/libuvcpp-*-${{ matrix.platform }} 2>/dev/null | head -1)
          if [ -z "$pkg" ]; then
            echo "::error title=doc-snippets::没找到 ${{ matrix.platform }} 的包（出包那步没产出？）"
            exit 1
          fi
          echo "pkg=$pkg"
          rc=0
          out=$(${{ matrix.py }} tests/tools/check_doc_snippets.py \
            --pkg "$pkg" --cxx ${{ matrix.cxx }} 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            # `前提` 也进匹配：rc=3（片段因为包里缺模块而**没判**）与 rc=1（判红了）
            # 是两件事，注解里必须分得开，否则"没判成"会被读成"红了"。
            msg=$(printf '%s\n' "$out" \
              | grep -E '\[红\]|\[停\]|红 [0-9]+ 条|前提|Error|Traceback' \
              | head -20 | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            echo "::error title=doc-snippets::${msg:-rc=$rc (no red line matched)}"
          fi
          exit "$rc"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-config-contract-${{ matrix.os }}
          path: ci-logs/
          if-no-files-found: ignore
