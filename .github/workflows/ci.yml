name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # Basic: static + shared, web=OFF (Ubuntu + macOS)
  # ---------------------------------------------------------------------------
  basic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv ninja

      - name: Configure & Build & Test (static)
        shell: bash
        run: |
          cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_STATIC=ON -DUVCPP_BUILD_SHARED=OFF \
            -DUVCPP_BUILD_WEB=OFF
          # 构建错误也折进注解。job 日志匿名读不到（/actions/jobs/<id>/logs 是 403），
          # `Upload build log` 的 artifact 下载同样要 token —— 剩下能读的只有注解。
          # 这一手是被 e3c0a0d 打的：四个 mac job 全挂在编译上（macOS 的 sigemptyset
          # 是宏，`::sigemptyset` 直接是语法错误），而本机 MSVC 整段跳过那个 `#if`，
          # 注解里只有一句 "exit code 2"，白等一轮。`set -o pipefail` 不能省：
          # 少了它 `cmake | tee` 的退出码是 tee 的 0，失败会被当成成功。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-static --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-static.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-static.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-static::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi
          # 失败用例名打成注解：job 日志从仓库外读不到（/actions/jobs/<id>/logs 要 token），注解匿名可读
          rc=0
          out=$(ctest --test-dir build-static --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-static::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-static-output::${blk}"
            fi
          fi
          exit "$rc"

      - name: Configure & Build & Test (shared)
        shell: bash
        run: |
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_STATIC=OFF -DUVCPP_BUILD_SHARED=ON \
            -DUVCPP_BUILD_WEB=OFF
          # 构建错误折进注解（说明见 static 步）。`set -o pipefail` 不能省。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-shared --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-shared.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-shared.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-shared::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi
          # 失败用例名打成注解（同 static 步）
          rc=0
          out=$(ctest --test-dir build-shared --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-shared::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-shared-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Windows basic: shared build only (static is covered by windows-static job)
  # ---------------------------------------------------------------------------
  windows-basic:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build
        shell: bash
        run: |
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_STATIC=OFF -DUVCPP_BUILD_SHARED=ON \
            -DUVCPP_BUILD_WEB=OFF
          # 构建错误折进注解（说明见 static 步）。`set -o pipefail` 不能省。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-shared --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-shared.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-shared.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-shared::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi

      - name: Copy runtime DLLs
        shell: bash
        run: |
          for d in tests/unit tests/functional tests/expand; do
            mkdir -p "build-shared/$d/Release"
            cp build-shared/Release/uvcpp.dll "build-shared/$d/Release/" 2>/dev/null || true
            cp build-shared/_deps/libuv-build/Release/uv.dll "build-shared/$d/Release/" 2>/dev/null || true
          done

      - name: Test
        shell: bash
        run: |
          # 失败用例名打成注解（同 basic 作业）
          rc=0
          out=$(ctest --test-dir build-shared --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-windows-basic::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-windows-basic-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Web: HTTP + WebSocket + webapp framework + zlib (all platforms)
  #
  # UVCPP_ENABLE_ZLIB must stay ON here: the webapp's compression tests assert
  # that gzip actually happens, so with zlib OFF those groups fail and the job
  # is testing a configuration nobody builds locally. zlib is FetchContent'd
  # when find_package misses, so this needs no extra dep on any platform.
  # ---------------------------------------------------------------------------
  web:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev zlib1g-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv zlib ninja

      # Configure and build are wrapped in one `log` group on purpose: with a
      # bare `bash -e` a configure failure kills the step and the only trace is
      # step stdout, which is unreadable from outside the repo (the log API
      # needs a token). Teeing to ci-logs/ and uploading it on failure means the
      # next red run hands over the actual compiler error text.  The
      # CONFIGURE_RC=/BUILD_RC= markers say which half died.
      - name: Configure & Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "=== toolchain ==="
            cmake --version
            echo "=== configure ==="
            cfg=0
            cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release \
              -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_WEB=ON \
              -DUVCPP_BUILD_WEBAPP=ON -DUVCPP_ENABLE_ZLIB=ON || cfg=$?
            echo "CONFIGURE_RC=$cfg"
            if [ "$cfg" != "0" ]; then exit "$cfg"; fi
            echo "=== resolved toolchain (CMakeCache) ==="
            grep -E '^(CMAKE_(GENERATOR|LINKER|CXX_COMPILER|C_COMPILER|VS_|MSVC)|MSVC_|OPENSSL_)' \
              build-web/CMakeCache.txt || true
            echo "=== build ==="
            bld=0
            cmake --build build-web --config Release --parallel 4 2>&1 \
              | tee ci-logs/build-web-build.log || bld=$?
            echo "BUILD_RC=$bld"
            # 构建错误折进注解（说明见 static 步）：这个 job 的 artifact 下载也要
            # token，日志照样读不到，注解是唯一出口。
            if [ "$bld" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                ci-logs/build-web-build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
                | head -c 6000 || true)
              echo "::error title=build-web::${msg:-rc=$bld (no error line matched)}"
            fi
            exit "$bld"
          } 2>&1 | tee ci-logs/build-web.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-web-${{ matrix.os }}
          path: ci-logs/
          if-no-files-found: ignore

      - name: Copy runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in tests/unit tests/functional tests/expand; do
            mkdir -p "build-web/$d/Release"
            cp build-web/Release/uvcpp.dll "build-web/$d/Release/" 2>/dev/null || true
            cp build-web/_deps/libuv-build/Release/uv.dll "build-web/$d/Release/" 2>/dev/null || true
            # llhttp — built as shared when BUILD_SHARED_LIBS=ON
            cp build-web/_deps/llhttp-build/Release/llhttp.dll "build-web/$d/Release/" 2>/dev/null || true
            cp build-web/_deps/llhttp-build/llhttp.dll "build-web/$d/Release/" 2>/dev/null || true
          done

      - name: Test
        shell: bash
        run: |
          # Only test_shutdown_func is excluded: it is flaky (~1%), not hanging.
          # test_tcp_func and test_memory_pool were excluded for defects that are
          # long fixed (see doc/ci-guide.md §4) — they run, and must stay green.
          rc=0
          out=$(ctest --test-dir build-web --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-web::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-web-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # SSL: Web + webapp + OpenSSL + zlib (all platforms)
  #
  # Same reasoning as the web job: the webapp's compression tests need
  # UVCPP_ENABLE_ZLIB=ON, and the locally validated TLS tree (build-ssl) has
  # zlib ON.  Off, this job would fail the same two gzip groups.
  # ---------------------------------------------------------------------------
  ssl:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libssl-dev zlib1g-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv openssl zlib ninja

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --no-progress

      - name: Configure & Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          {
            echo "=== toolchain ==="
            cmake --version
            openssl version 2>/dev/null || echo "(openssl not on PATH)"
            echo "=== configure ==="
            cfg=0
            cmake -S . -B build-ssl -DCMAKE_BUILD_TYPE=Release \
              -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_SHARED=ON \
              -DUVCPP_BUILD_WEB=ON -DUVCPP_BUILD_WEBAPP=ON -DUVCPP_ENABLE_OPENSSL=ON \
              -DUVCPP_ENABLE_ZLIB=ON || cfg=$?
            echo "CONFIGURE_RC=$cfg"
            if [ "$cfg" != "0" ]; then exit "$cfg"; fi
            echo "=== resolved toolchain (CMakeCache) ==="
            grep -E '^(CMAKE_(GENERATOR|LINKER|CXX_COMPILER|C_COMPILER|VS_|MSVC)|MSVC_|OPENSSL_)' \
              build-ssl/CMakeCache.txt || true
            echo "=== build ==="
            bld=0
            cmake --build build-ssl --config Release --parallel 4 2>&1 \
              | tee ci-logs/build-ssl-build.log || bld=$?
            echo "BUILD_RC=$bld"
            # 构建错误折进注解（说明见 static 步）：artifact 下载要 token，
            # 注解是唯一读得到的出口。
            if [ "$bld" != "0" ]; then
              msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
                ci-logs/build-ssl-build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
                | head -c 6000 || true)
              echo "::error title=build-ssl::${msg:-rc=$bld (no error line matched)}"
            fi
            exit "$bld"
          } 2>&1 | tee ci-logs/build-ssl.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ssl-${{ matrix.os }}
          path: ci-logs/
          if-no-files-found: ignore

      - name: Copy runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for d in tests/unit tests/functional tests/expand; do
            mkdir -p "build-ssl/$d/Release"
            # uvcpp + libuv + llhttp (llhttp built as shared when BUILD_SHARED_LIBS=ON)
            cp build-ssl/Release/uvcpp.dll "build-ssl/$d/Release/" 2>/dev/null || true
            cp build-ssl/_deps/libuv-build/Release/uv.dll "build-ssl/$d/Release/" 2>/dev/null || true
            cp build-ssl/_deps/llhttp-build/Release/llhttp.dll "build-ssl/$d/Release/" 2>/dev/null || true
            cp build-ssl/_deps/llhttp-build/llhttp.dll "build-ssl/$d/Release/" 2>/dev/null || true
          done
          # OpenSSL DLLs — uvcpp.dll links against them; they must be findable
          for ssl_dir in \
            "C:/Program Files/OpenSSL/bin" \
            "C:/Program Files/OpenSSL-Win64/bin" \
            "C:/Program Files (x86)/OpenSSL/bin" \
            "C:/Program Files/OpenSSL-Win32/bin"; do
            if [ -d "$ssl_dir" ]; then
              echo "Found OpenSSL DLLs in: $ssl_dir"
              for d in tests/unit tests/functional tests/expand; do
                cp "$ssl_dir"/libssl-*.dll "build-ssl/$d/Release/" 2>/dev/null || true
                cp "$ssl_dir"/libcrypto-*.dll "build-ssl/$d/Release/" 2>/dev/null || true
              done
              break
            fi
          done

      - name: Test
        shell: bash
        run: |
          # Only test_shutdown_func is excluded (flaky ~1%, not hanging) — see the
          # web job above and doc/ci-guide.md §4.
          rc=0
          out=$(ctest --test-dir build-ssl --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-ssl::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-ssl-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Full: Web + OpenSSL + zlib (Ubuntu + macOS)
  # ---------------------------------------------------------------------------
  full:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libssl-dev zlib1g-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv openssl zlib ninja

      - name: Configure & Build & Test
        shell: bash
        run: |
          cmake -S . -B build-full -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_SHARED=ON \
            -DUVCPP_BUILD_WEB=ON -DUVCPP_ENABLE_OPENSSL=ON -DUVCPP_ENABLE_ZLIB=ON
          # 构建错误折进注解（说明见 static 步）。`set -o pipefail` 不能省。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-full --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-full.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-full.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-full::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi
          # 失败用例名打成注解（同 basic 作业）
          rc=0
          out=$(ctest --test-dir build-full --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-full::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-full-output::${blk}"
            fi
          fi
          exit "$rc"

  # ---------------------------------------------------------------------------
  # Windows static: MSVC static build (web=OFF, no shared lib)
  # ---------------------------------------------------------------------------
  windows-static:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build
        shell: bash
        run: |
          cmake -S . -B build-msvc -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON -DUVCPP_BUILD_STATIC=ON -DUVCPP_BUILD_SHARED=OFF \
            -DUVCPP_BUILD_WEB=OFF
          # 构建错误折进注解（说明见 static 步）。`set -o pipefail` 不能省。
          set -o pipefail
          mkdir -p ci-logs
          bld=0
          cmake --build build-msvc --config Release --parallel 4 2>&1 \
            | tee ci-logs/build-msvc.log || bld=$?
          if [ "$bld" != "0" ]; then
            msg=$(grep -E 'error:|error C[0-9]|error LNK|Error|FAILED|undefined reference' \
              ci-logs/build-msvc.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' \
              | head -c 6000 || true)
            echo "::error title=build-msvc::${msg:-rc=$bld (no error line matched)}"
            exit "$bld"
          fi

      - name: Copy runtime DLLs
        shell: bash
        run: |
          for d in tests/unit tests/functional tests/expand; do
            mkdir -p "build-msvc/$d/Release"
            cp build-msvc/_deps/libuv-build/Release/uv.dll "build-msvc/$d/Release/" 2>/dev/null || true
          done

      - name: Test
        shell: bash
        run: |
          rc=0
          out=$(ctest --test-dir build-msvc --output-on-failure -C Release \
            --timeout 30 --exclude-regex "test_shutdown_func" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" != "0" ]; then
            msg=$(printf '%s\n' "$out" | grep -A40 'The following tests FAILED' | tr '\n' ' ' | sed 's/%/%25/g' || true)
            echo "::error title=ctest-build-msvc::${msg:-rc=$rc (no FAILED block)}"
            # 失败用例的**子进程输出**：`--output-on-failure` 把它的 stdout/stderr 紧跟在
            # 自己的 `***`（SegFault / Subprocess aborted / Timeout）结果行之后。job 日志
            # 匿名读不到（`/actions/jobs/<id>/logs` 是 403），所以每个失败块取前 30 行一并
            # 折进注解 —— 否则注解里只有用例名，没有崩溃现场（断言文案 / glibc 的
            # `free(): invalid pointer` 全在那段里）。
            blk=$(printf '%s\n' "$out" | awk '/\*\*\*/ { n = 30 } n > 0 { print; n-- }' \
              | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | head -c 6000 || true)
            if [ -n "$blk" ]; then
              echo "::error title=ctest-build-msvc-output::${blk}"
            fi
          fi
          exit "$rc"
