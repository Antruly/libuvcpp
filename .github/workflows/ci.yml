name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # Basic build (no optional deps) — all platforms
  # =========================================================================
  basic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libuv ninja

      - name: Configure & Build & Test (static)
        run: |
          cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON \
            -DUVCPP_BUILD_SHARED=OFF -DUVCPP_BUILD_STATIC=ON \
            -DUVCPP_BUILD_WEB=OFF \
            -DUVCPP_BUILD_NET=ON
          cmake --build build-static --config Release --parallel
          ctest --test-dir build-static --output-on-failure -C Release --exclude-regex "test_shutdown_func|test_tcp_func" || true

      - name: Configure & Build & Test (shared)
        run: |
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON \
            -DUVCPP_BUILD_SHARED=ON -DUVCPP_BUILD_STATIC=OFF \
            -DUVCPP_BUILD_WEB=OFF \
            -DUVCPP_BUILD_NET=ON
          cmake --build build-shared --config Release --parallel
          ctest --test-dir build-shared --output-on-failure -C Release --exclude-regex "test_shutdown_func|test_tcp_func" || true

  # =========================================================================
  # Web module build (llhttp) — Ubuntu + Windows
  # =========================================================================
  web:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev ninja-build

      - name: Configure & Build & Test (web)
        run: |
          cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON \
            -DUVCPP_BUILD_SHARED=ON \
            -DUVCPP_BUILD_WEB=ON
          cmake --build build-web --config Release --parallel
          ctest --test-dir build-web --output-on-failure -C Release --exclude-regex "test_shutdown_func|test_tcp_func" || true

  # =========================================================================
  # SSL build (OpenSSL) — Ubuntu + Windows
  # =========================================================================
  ssl:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libssl-dev ninja-build

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install openssl --no-progress
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV

      - name: Configure & Build & Test (ssl)
        run: |
          cmake -S . -B build-ssl -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON \
            -DUVCPP_BUILD_SHARED=ON \
            -DUVCPP_BUILD_WEB=ON \
            -DUVCPP_ENABLE_OPENSSL=ON
          cmake --build build-ssl --config Release --parallel
          ctest --test-dir build-ssl --output-on-failure -C Release --exclude-regex "test_shutdown_func|test_tcp_func" || true

  # =========================================================================
  # Full build (web + ssl + zlib) — Ubuntu only
  # =========================================================================
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libssl-dev zlib1g-dev ninja-build

      - name: Configure & Build & Test (full)
        run: |
          cmake -S . -B build-full -DCMAKE_BUILD_TYPE=Release \
            -DUVCPP_BUILD_TESTS=ON \
            -DUVCPP_BUILD_SHARED=ON \
            -DUVCPP_BUILD_WEB=ON \
            -DUVCPP_ENABLE_OPENSSL=ON \
            -DUVCPP_ENABLE_ZLIB=ON
          cmake --build build-full --config Release --parallel
          ctest --test-dir build-full --output-on-failure -C Release --exclude-regex "test_shutdown_func|test_tcp_func" || true

  # =========================================================================
  # Windows MSVC static (x64), basic only
  # =========================================================================
  windows-static:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build & Test
        run: |
          cmake -S . -B build-msvc -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DUVCPP_BUILD_TESTS=ON `
            -DUVCPP_BUILD_SHARED=OFF -DUVCPP_BUILD_STATIC=ON `
            -DUVCPP_BUILD_WEB=OFF
          cmake --build build-msvc --config Release --parallel
          ctest --test-dir build-msvc --output-on-failure -C Release
