# C ABI 的符号面锁 —— tests/tools/check_capi_symbols.py --update 生成
#
# 分片写：`#@ module <名>` 开一片，后面一行一个符号，字典序。片名与
# 它那份头的对应在 check_capi_symbols.py 的 MODULES 里。
#
# 为什么分片：一条腿只开得起一部分模块（Linux 那条 `capi` 腿没有
# NGHTTP2 / QUIC / HTTP3），而「锁里有、库里没有」在那条腿上不是
# 缺面、是**这一片本来就不该有**。判据 2 按每片自己的开关逐片判：
# 开着 → 逐条相等；关着 → 一个都不许出现（并如实印「未判」）。
#
# 删/改任何一个都要把 UVCPP_C_ABI_VERSION +1（见 doc/capi-guide.md
# 的 ABI 契约那节）。
# 共 402 个，8 片。
